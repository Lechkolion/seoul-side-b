var galIdx = 0;

// == ACTIVITY DETAIL =========================================================
// An activity cannot carry a page on one photo plus a grid of keyword boxes the
// way a restaurant can. This view splits experience from admin: highlights read
// as things you actually do, and every operational fact lives in the stat block
// or in "Good to know", once.

// Strings that were sitting inside experience lists but are really operations.
// Hours and booking already have a home in the stats, so they are dropped here
// rather than repeated as if they were something to see.
var OPS_STRINGS = {
 "10:00-20:00, last entry 19:00": 1, "10:00–20:00, last entry 19:00": 1,
 "09:00-18:00, closed Monday": 1,    "09:00–18:00, closed Monday": 1,
 "open 10:00-22:30, later at weekends": 1, "open 10:00–22:30, later at weekends": 1,
 "open late": 1, "open 24 hours": 1, "open until about 03:00": 1,
 "screenings from 11:00": 1, "booking via CGV": 1,
 "men's sauna open 24 hours": 1, "women's sauna 06:00 to 22:00": 1,
 "T-money and card boarding": 1
};
// v4 adds a real highlight object, {title, description}. Entries that have not been
// rewritten yet still return their keyword strings, so the page degrades to the v3
// behaviour for those rather than emptying the section.
function highlightsOf(p){
  if (p.highlights && p.highlights.length) return p.highlights;
  return (p.whats || []).filter(function(w){ return !OPS_STRINGS[w]; })
    .map(function(w){ return {title: w, description: null}; });
}

// A small keyword map so each highlight gets a face. Anything unmatched falls
// back to a neutral mark rather than a wrong one.
var HI_ICONS = [
  [/wine|tasting|cocktail|whisky|drink|bar|cafe|coffee|food|meal|dining/i, "fork"],
  [/art|installation|exhibition|gallery|sculpt|mural|painting/i, "img"],
  [/light|media|projection|neon|laser|illuminat/i, "spark"],
  [/tank|aquarium|shark|beluga|marine|jellyfish|penguin|fish/i, "binoc"],
  [/cinema|screen|imax|dolby|film|recliner|seat|projector/i, "img"],
  [/bowl|lane|arcade|vr|simulator|golf|dart|bat|game|karaoke/i, "walk"],
  [/sauna|spa|bath|pool|massage|jjimjil|onsen/i, "cloud"],
  [/garden|plant|greenhouse|forest|tree|flower|botanic|orchid/i, "sun"],
  [/cruise|boat|pier|river|ferry|sail|deck/i, "bus"],
  [/view|observation|skyline|panoram|terrace|floor|rooftop|lookout/i, "sun"],
  [/tunnel|cave|mine|underground|cavern/i, "map"],
  [/temperature|cool|warm|year-round|climate|indoor/i, "cloud"],
  [/walk|trail|path|loop|stroll/i, "walk"]
];
function hiIcon(t){
  for (var i = 0; i < HI_ICONS.length; i++) if (HI_ICONS[i][0].test(t)) return HI_ICONS[i][1];
  return "check";
}
function sentence(t){ return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }

function galleryX(p){
  var imgs = p.images || [];
  if (!imgs.length){
    return '<div class="galx galx-one"><div class="galx-main">' +
      '<div class="ph-fb">' + ic("img", "ic-24") + '<span>' +
      esc((CATLABEL[p.cat] || "").toUpperCase()) + '</span></div></div></div>';
  }
  var main = Math.min(galIdx, imgs.length - 1);

  return '<div class="galx' + (imgs.length < 2 ? " galx-one" : "") + '">' +
    '<div class="galx-main">' +
      '<img src="' + esc(imgs[main]) + '" alt="' + esc(p.name) + '" onerror="this.remove()">' +
      (imgs.length > 1 ? '<span class="gpill l">' + (main + 1) + ' / ' + imgs.length + '</span>' : '') +
      '<span class="gpill r">' + ic("pin", "ic-16") + esc(p.station) + '</span>' +
    '</div>' +
    (imgs.length > 1 ? '<div class="galx-thumbs">' + thumbs.map(function(u, i){
      return '<button data-goto="' + i + '" class="' + (i === main ? "on" : "") + '" ' +
             'aria-label="Photo ' + (i + 1) + '"><img src="' + esc(u) +
             '" alt="" onerror="this.remove()"></button>';
    }).join("") + '</div>' : '') +
  '</div>';
}

// The large mid-page image. Only for categories whose appeal is what the place looks like,
// and only when the gallery has enough photos that this is not a thumbnail repeated. It is
// deliberately never offered to a restaurant or a shop.
var BIGSHOT_TYPES = {
  "Unusual":1, "Aquarium":1, "Observatory":1, "Immersive art":1, "Exhibition":1,
  "Indoor garden":1, "Spa":1, "River cruise":1, "Viewpoint":1, "Media art":1, "Day trip":1
};
function bigShot(p){
  if (p.cat !== "DO") return null;
  if (!BIGSHOT_TYPES[p.type]) return null;

  if (imgs.length < 5) return null;

        '<h1 class="d-h1">' + esc(p.name) + '</h1>' +
        (p.nameKr ? '<p class="d-kr">' + esc(p.nameKr) + '</p>' : '') +

          '<div>' + ic("train", "ic-24") + '<div><b>' + travelTxt(p) + '</b><span>from ' + HOME +

        '<div class="dacts">' +

          '<div><b>Energy</b><span>' + (easy ? "Low effort, easy to cut short."

        // Nothing within walking or a short ride. Say that, rather than inventing proximity.
        (foodBack.length ? '<section class="railsec"><h3>Eat on the way back</h3>' +
          '<p class="railnote">Nothing in this guide is close enough to ' + esc(p.name) +
          ' to call it nearby, so these are near the apartment instead.</p>' +
          foodBack.map(function(f){
            return '<a class="railrow" href="#/place/' + f.p.id + '">' +

      '</aside>' +

function wonFmt(n){
  n = Number(n) || 0;
  return "₩" + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

// ── today builder ─────────────────────────────────────────────────
var suggMode = "core";
function viewToday(){
  var day = S.day || 22;
  var ids = todayList(day);
  var items = ids.map(function(i){ return byId[i]; });
  var warn = routeWarning(items);
  var t = TRIP.filter(function(x){ return x.d === day; })[0] || TRIP[0];
  var hol = HOLIDAY.indexOf(day) > -1;
  var shut = items.filter(function(p){ return closedOn(p, day); });
  // The builder leads with core picks. Alternatives exist for the day the core list has
  // already been used up, so they are one tap away rather than mixed in.
  var openToday = sorted(pool({hideBeen:true}).filter(function(p){
    return p.cat!=="EVENT" && ids.indexOf(p.id)<0 && !closedOn(p,day); }));
  var coreOpen = openToday.filter(function(p){ return p.tier==="core"; });
  var altOpen  = openToday.filter(function(p){ return p.tier!=="core"; });
  var sugg = (suggMode==="alt" ? altOpen : coreOpen).slice(0,6);

  return hero("TODAY", "Build today", "Pick two to four places. We will put them in a sensible order and tell you if they do not belong on the same day.",
      ["So, where","are we going?"], heroPhoto())+
  '<div class="wrap"><div class="pcols">'+
    '<div>'+
      '<div class="panel"><div class="stepper">'+ic("today","ic")+
        '<button data-day="-1" aria-label="Previous day">'+ic("chevL","ic-16")+'</button>'+
        '<span class="t">'+t.dow+', '+day+' Sep 2026 · Day '+(TRIP.indexOf(t)+1)+'</span>'+
        '<button data-day="1" aria-label="Next day">'+ic("chev","ic-16")+'</button></div>'+

      (hol ? '<div class="warn">'+ic("warn","ic-22")+'<div><b>'+
        (day===CHUSEOK_DAY?"Chuseok day itself":"Chuseok holiday")+'</b>'+
        '<p>'+(day===CHUSEOK_DAY
          ? "Most independent restaurants are shut. Big malls mostly open at noon rather than 10:30."
          : "Many small restaurants close today. Malls, department stores and attractions mostly trade normally.")+
        '</p></div></div>' : '')+

      (shut.length ? '<div class="warn">'+ic("warn","ic-22")+'<div><b>'+shut.length+
        ' on this list '+(shut.length===1?"is":"are")+' closed on '+day+' September</b>'+
        '<p>'+shut.map(function(p){ return esc(p.name); }).join(", ")+
        '. Move '+(shut.length===1?"it":"them")+' to another day.</p></div></div>' : '')+

      '<div class="tl">'+
        '<div class="tli"><span class="n">1</span><span class="tli-ph ho">'+ic("home","ic-16")+'</span>'+
          '<span class="tli-b"><b>Home ('+HOME+')</b><span>Start · 10:00</span></span></div>'+
        items.map(function(p,i){
          return '<div class="tli"><span class="n">'+(i+2)+'</span>'+
            '<span class="tli-ph">'+img(p,0)+'</span>'+
            '<span class="tli-b"><b>'+esc(p.name)+'</b><span>'+esc(CATLABEL[p.cat])+' · '+
              travelTxt(p)+' from home'+(closedOn(p,day)?' · closed today':'')+'</span></span>'+
            '<button class="x" data-rm="'+p.id+'" aria-label="Remove '+esc(p.name)+'">'+ic("x","ic-16")+'</button>'+
            '<span class="x">'+ic("grip","ic-16")+'</span></div>';
        }).join("")+
        (items.length < 4 ? '<button class="addstop" data-scroll-sugg><span class="dash">'+ic("plus","ic-16")+'</span>'+
          '<span>Add a stop'+(items.length?" (optional)":"")+'</span><span class="pl">'+ic("plus","ic-16")+'</span></button>' : '')+
        '<div class="tli"><span class="n">'+(items.length+2)+'</span><span class="tli-ph ho">'+ic("home","ic-16")+'</span>'+
          '<span class="tli-b"><b>Back to '+HOME+'</b><span>'+
          (items.length? "~"+(items[items.length-1].travel.min||20)+" min" : "—")+'</span></span></div>'+
      '</div>'+

      (warn ? '<div class="warn">'+ic("warn","ic-22")+'<div><b>'+esc(warn.title)+'</b><p>'+esc(warn.body)+'</p></div></div>' : '')+

      '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">'+
        '<a class="btn btn-line" href="#/map">'+ic("map","ic-16")+'See on the map</a>'+
        (items.length?'<button class="btn btn-line" data-clear-today>'+ic("x","ic-16")+'Clear the day</button>':'')+
      '</div>'+

function routeWarning(items){
  if (items.length < 2) return null;
  var far = [];
  for (var i=0;i<items.length;i++) for (var j=i+1;j<items.length;j++){
    var a = items[i], b = items[j];
    if (a.cluster !== b.cluster){
      var gap = Math.abs((a.travel.min||0) - (b.travel.min||0));
      var sum = (a.travel.min||0) + (b.travel.min||0);
      if (gap >= 20 || sum >= 60) far.push([a,b,gap]);
    }
  }
  if (!far.length) return null;
  far.sort(function(x,y){ return y[2]-x[2]; });
  var w = far[0];
  return {title:"These two are on opposite sides of the city",
    body:w[0].name+" ("+w[0].cluster+") and "+w[1].name+" ("+w[1].cluster+") are a long way apart. "+
         "Doing both means crossing Seoul mid-afternoon. Consider moving one to another day."};
}

// ── map ───────────────────────────────────────────────────────────
var mapFilter = "ALL", mapSel = null, mapArea = "";
// ── map ────────────────────────────────────────────────────────────────────
// v3 drew latitude and longitude as percentages on a blank canvas. It had no streets, no
// river and no way to tell whether two pins were a walk apart or an hour apart, which is the
// only question a map on this page exists to answer. v4 hands the positioning to Leaflet and
// renders real tiles underneath.
//
// Tiles: standard OpenStreetMap raster, which needs no key and is fine for a single
// private page at this volume, used under the OSM tile usage policy with the attribution
// it requires shown on the map. CARTO's Voyager basemap was the nicer visual match and was
// tried first, but CARTO now stamps "API KEY REQUIRED" across keyless tiles, so it is out.
// The fallback is the German OSM mirror, also keyless. If both fail the map says so.
var MAP_TILES = [
  {url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", sub:null, max:19,
   attr:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'},
  {url:"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png", sub:"abcd", max:19,
   attr:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, &copy; <a href="https://carto.com/attributions">CARTO</a>'},
  {url:"https://tile.openstreetmap.de/{z}/{x}/{y}.png", sub:null, max:18,
   attr:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}
];
var CATCOLOR = {SHOP:"#C2603F", EAT:"#C99A2E", DO:"#4F7A52", VIEW:"#3D6E93", EVENT:"#9A6BA8"};

var _map = null, _layer = null, _tiles = null, _tileTry = 0, _mapMarkers = {};

function mapPinIcon(p, sel){
  var c = CATCOLOR[p.cat] || "#6B6259";
  return L.divIcon({
    className: "lpin-wrap",
    html: '<span class="lpin' + (sel ? " sel" : "") + '" style="--pc:' + c + '"></span>',
    iconSize: [18, 18], iconAnchor: [9, 9], popupAnchor: [0, -11]
  });
}
function mapHomeIcon(){
  return L.divIcon({className:"lpin-wrap", html:'<span class="lpin home"></span>',
                    iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-15]});
}
function popupHtml(p){
  var px = priceShort(p);
  return '<div class="lpop">' +
    ((p.images && p.images[0]) ? '<img src="' + esc(p.images[0]) +
      '" alt="" onerror="this.remove()">' : '') +
    '<div class="lpop-b">' +
      '<span class="lpop-cat" style="--pc:' + (CATCOLOR[p.cat] || "#6B6259") + '">' +
        esc(p.type || CATLABEL[p.cat]) + '</span>' +
      '<b>' + esc(p.name) + '</b>' +
      '<p>' + esc(p.why.split(". ")[0]) + '.</p>' +
      '<span class="lpop-m">' + ic("train", "ic-16") + travelTxt(p) + ' from ' + HOME +
        (px ? ' <i>&middot;</i> ' + esc(px) : (p.cost ? ' <i>&middot;</i> ' + esc(p.cost) : '')) +
      '</span>' +
      '<span class="lpop-a">' +
        '<a class="btn btn-dark" href="#/place/' + p.id + '">Details</a>' +
        '<button class="btn btn-sand" data-add="' + p.id + '">Add to today</button>' +
      '</span>' +
    '</div></div>';
}

function tileFail(){
  if (!el("leaf")) return;
  _tileTry++;
  if (_tileTry < MAP_TILES.length && _map){
    // Try the next provider silently. Only once every provider has failed do we say so,
    // because a single slow mirror is not worth an error message.
    try { if (_tiles) _map.removeLayer(_tiles); } catch (e) {}
    _tiles = mapTileLayer(_tileTry).addTo(_map);
    return;
  }
  var n = el("mapfail");
  if (n) n.hidden = false;
}
function mapTileLayer(i){
  var t = MAP_TILES[i];
  // No crossOrigin. Nothing here reads tile pixels back, and asking for a CORS fetch is
  // one more thing that can fail: a null origin off the file system, a corporate proxy
  // that strips the header, an offline cache that never had one.
  var o = {maxZoom:t.max, attribution:t.attr, keepBuffer:1};
  if (t.sub) o.subdomains = t.sub;
  var layer = L.tileLayer(t.url, o);
  var ok = 0, bad = 0, done = false;
  function settle(){ if (!done){ done = true; tileFail(); } }
  layer.on("tileload", function(){ ok++; done = true; });
  layer.on("tileerror", function(){ bad++; if (ok === 0 && bad >= 6) settle(); });
  // The silent case: requests that hang rather than error produce no tileerror at all,
  // so without this the map stays a grey rectangle with nothing explaining why.
  setTimeout(function(){ if (ok === 0 && _tiles === layer) settle(); }, 7000);
  return layer;
}

function buildMap(list){
  var box = el("leaf");
  if (!box) return;
  if (typeof L === "undefined" || !L.map){
    // Leaflet itself could not load, so there is no map to show. Say so.
    var n = el("mapfail"); if (n) n.hidden = false;
    box.classList.add("dead");
    return;
  }
  if (_map){ try { _map.remove(); } catch (e) {} _map = null; }
  _mapMarkers = {};
  _tileTry = 0;
  _map = L.map(box, {scrollWheelZoom:true, zoomControl:true, attributionControl:true,
                     preferCanvas:false});
  _tiles = mapTileLayer(0).addTo(_map);
  _map.setView([37.5326, 127.0246], 11);

  var homeM = L.marker([HOMEC.lat, HOMEC.lng], {icon:mapHomeIcon(), zIndexOffset:900,
                                                title:"Home, " + HOME});
  homeM.bindPopup('<div class="lpop"><div class="lpop-b"><b>Home</b>' +
    '<p>Two minutes south-west of Nonhyeon Station. Every travel time in this guide ' +
    'is measured from here.</p></div></div>', {maxWidth:260});
  homeM.addTo(_map);

  // 130 pins on one citywide view is an unreadable smear, so they cluster until you zoom
  // into an area, which is also the zoom at which the street names become useful.
  var useCluster = typeof L.markerClusterGroup === "function";
  _layer = useCluster
    ? L.markerClusterGroup({
        maxClusterRadius: 46, showCoverageOnHover: false, spiderfyOnMaxZoom: true,
        disableClusteringAtZoom: 15,
        iconCreateFunction: function(c){
          var n = c.getChildCount();
          return L.divIcon({className:"lclu-wrap",
            html:'<span class="lclu' + (n > 24 ? " big" : n > 9 ? " mid" : "") + '">' + n + '</span>',
            iconSize:[34,34], iconAnchor:[17,17]});
        }})
    : L.layerGroup();

  list.forEach(function(p){
    var m = L.marker([p.lat, p.lng], {icon:mapPinIcon(p, mapSel === p.id), title:p.name});
    m.bindPopup(popupHtml(p), {maxWidth:272, minWidth:230, autoPanPadding:[18, 74],
                               closeButton:true, className:"lpop-w"});
    m.on("popupopen", function(){ mapSel = p.id; });
    m.on("popupclose", function(){ if (mapSel === p.id) mapSel = null; });
    _mapMarkers[p.id] = m;
    _layer.addLayer(m);
  });
  _map.addLayer(_layer);

  // Frame on what is actually shown, home included, so switching area or category reframes
  // the map instead of leaving you looking at the wrong half of the city.
  //
  // v4 had two entries outside Seoul and trimmed the extreme 4% of each axis to keep them
  // from dragging the frame. v5 has closer to twenty: outlets at Yeoju and Icheon, an
  // island at Gapyeong, a fortress at Suwon, a resort at Incheon Airport. A percentile
  // trim cannot hold that, and the first view became the whole of Gyeonggi-do with Seoul
  // as a dot in the middle.
  //
  // So the frame is drawn from the points within 25 km of home, which is the city and the
  // ring of suburbs anyone treats as a normal outing. The day trips sit off the first view
  // on purpose, one zoom-out away, and the cluster counts make it obvious they are there.
  // Pick an area that is entirely out of town and the filter finds nothing, so it falls
  // back to framing everything in the list, which is then the right answer.
  function band(vals, lo, hi){
    var v = vals.slice().sort(function(a,b){ return a-b; });
    if (v.length < 8) return [v[0], v[v.length-1]];
    return [v[Math.floor(v.length*lo)], v[Math.min(v.length-1, Math.ceil(v.length*hi)-1)]];
  }
  var near = list.filter(function(p){
    var d = km({lat:p.lat, lng:p.lng}, HOMEC);
    return d != null && d <= 25;
  });
  var frame = near.length >= 3 ? near : list;
  var pts = frame.map(function(p){ return [p.lat, p.lng]; });
  if (pts.length > 1){
    var bl = band(pts.map(function(q){ return q[0]; }), 0.04, 0.96);
    var bg = band(pts.map(function(q){ return q[1]; }), 0.04, 0.96);
    // Home is normally kept in frame, because every number on the page is measured from it.
    // Not when an area is selected: framing Jamsil and Nonhyeon together halves the zoom and
    // the whole point of picking an area is to look at that area.
    // Named `bnds`, not `box`. `box` up at the top of this function is the map's DOM
    // element, `var` is function-scoped, and reusing the name here quietly overwrote it
    // for the rest of the function.
    var bnds = mapArea
      ? L.latLngBounds([[bl[0], bg[0]], [bl[1], bg[1]]])
      : L.latLngBounds([
          [Math.min(bl[0], HOMEC.lat), Math.min(bg[0], HOMEC.lng)],
          [Math.max(bl[1], HOMEC.lat), Math.max(bg[1], HOMEC.lng)]
        ]);
    try { _map.fitBounds(bnds.pad(0.10), {maxZoom:15, animate:false}); }
    catch (e) { _map.setView([37.5326, 127.0246], 11); }
  } else if (pts.length === 1){
    _map.setView(pts[0], 15);
  }
  setTimeout(function(){ if (_map) _map.invalidateSize(); }, 60);
  mapWatchSize(box);

  if (mapSel && _mapMarkers[mapSel]){
    var sm = _mapMarkers[mapSel];
    if (useCluster && _layer.zoomToShowLayer) _layer.zoomToShowLayer(sm, function(){ sm.openPopup(); });
    else sm.openPopup();
  }
}

function viewMap(){
  var ids = todayList(S.day||22);
  var list = P.filter(function(p){
    if (p.lat == null || p.lng == null || has("no",p.id)) return false;
    if (mapArea && p.cluster !== mapArea) return false;
    if (mapFilter === "SAVED") return has("saved",p.id);
    if (mapFilter === "TODAY") return ids.indexOf(p.id) > -1;
    if (mapFilter !== "ALL") return p.cat === mapFilter;
    return true;
  });
  var mapAreas = {};
  P.forEach(function(p){ if (p.lat != null && p.cluster) mapAreas[p.cluster] = (mapAreas[p.cluster]||0)+1; });
  var mapAreaKeys = Object.keys(mapAreas).sort();

  return hero("MAP", "Where things are", "Every place in this guide on a real map. Tap a pin for the travel time from home and the price.",
    [nPlaces(true)+".","All of them checked."], heroPhoto())+
  '<div class="wrap">'+
    '<div class="tabs">'+["ALL","SHOP","EAT","DO","VIEW","SAVED","TODAY"].map(function(k){
      return '<button class="tab'+(mapFilter===k?" on":"")+'" data-mapf="'+k+'">'+
        (k==="ALL"?"Everything":k==="SAVED"?"Saved":k==="TODAY"?"On today":CATLABEL[k])+'</button>'; }).join("")+'</div>'+
    '<label class="sortwrap" style="margin:0 0 12px">Area <select id="maparea">'+
      '<option value=""'+(mapArea?"":" selected")+'>Everywhere</option>'+
      mapAreaKeys.map(function(a){ return '<option value="'+esc(a)+'"'+(mapArea===a?" selected":"")+'>'+
        esc(a)+' ('+mapAreas[a]+')</option>'; }).join("")+'</select></label>'+
    '<div class="leafwrap">'+
      '<div id="leaf" class="leaf"></div>'+
      '<div class="mapfail" id="mapfail" hidden>'+ic("warn","ic-24")+
        '<b>Map tiles could not load.</b>'+
        '<span>'+(location.protocol === "file:"
          ? "This page was opened straight off the disk. Browsers block the map library "+
            "at that origin, so serve the folder over http, or use Naver Map for now."
          : "Check the connection and reload, or open the places in Naver Map instead.")+'</span>'+
        '<a class="btn btn-dark" target="_blank" rel="noopener" href="https://map.naver.com/">Open Naver Map</a>'+
      '</div>'+
      '<div class="maplg">'+["SHOP","EAT","DO","VIEW"].map(function(k){
        return '<i><span class="d" style="background:'+CATCOLOR[k]+'"></span>'+CATLABEL[k]+'</i>'; }).join("")+
        '<i><span class="d hm"></span>Home</i></div>'+
    '</div>'+
    '<p class="cnt-s" style="margin-top:10px">'+list.length+' place'+(list.length===1?"":"s")+
      ' shown. Pins group together until you zoom in.</p>'+
  '</div>';
}

// ───────────────────────────── render ─────────────────────────────
function render(){
  chrome();
  var v = route.view, html;
  if (v === "place") html = viewPlace(route.arg);
  else if (v === "browse") {
    // #/browse/eat deep-links a category, so Home and the tab bar can point at one slice
    if (route.arg){
      var want = route.arg.toUpperCase();
      if (CATLABEL[want]){ F.cat = want; F.types = []; F.mood = null;
        if (want === "EVENT") F.tier = "all"; }
      route.arg = null;   // one shot, otherwise it would re-apply over every later click
    }
    html = viewBrowse();
  }
  else if (v === "today") html = viewToday();
  else if (v === "plan") html = viewPlan();
  else if (v === "map") html = viewMap();
  else if (v === "saved") html = viewSaved();
  else html = viewHome();
  el("app").innerHTML = html;
  wire();
}

function onClick(e){
    var t;
    // A mood page stays curated: it is a short answer to "what should we do today".
    // Plain Browse keeps the full catalogue, which is the whole point of the v4 default.
    if ((t = e.target.closest("[data-mood]"))) {
      F.mood = t.dataset.mood; F.cat=null; F.types=[]; F.tier="core"; F.sort="rec";
      go("/browse"); return; }
    if ((t = e.target.closest("[data-save]"))) {
      var on = toggle("saved", t.dataset.save); toast(on?"Saved":"Removed from saved"); render(); return; }
    if ((t = e.target.closest("[data-add]"))) { addToday(t.dataset.add); return; }
    if ((t = e.target.closest("[data-rm]"))) {
      var d = S.day||22; S.today[d] = todayList(d).filter(function(i){ return i!==t.dataset.rm; }); save(); render(); return; }
    if ((t = e.target.closest("[data-been]"))) { toggle("been", t.dataset.been); render(); return; }
    if ((t = e.target.closest("[data-no]")))   { toggle("no", t.dataset.no); render(); return; }
    if ((t = e.target.closest("[data-clear-today]"))) { S.today[S.day||22]=[]; save(); render(); return; }
    if ((t = e.target.closest("[data-day]"))) {
      var v = +t.dataset.day;
      if (t.classList.contains("opt")) { F.openDay = v || null; render(); return; }
      var i = TRIP.map(function(x){return x.d;}).indexOf(S.day||22);
      i = Math.max(0, Math.min(TRIP.length-1, i + v)); S.day = TRIP[i].d; save(); render(); return; }
    if ((t = e.target.closest("[data-tier]"))) { F.tier = t.dataset.tier; render(); return; }
    if ((t = e.target.closest("[data-sugg]"))) { suggMode = t.dataset.sugg; render(); return; }
    if ((t = e.target.closest("[data-cat]"))) {
      var nc = t.dataset.cat;
      F.cat = (nc === "*") ? null : nc;
      F.types = []; F.mood = null;                 // the old type facet belonged to the old category
      render(); return; }
    if ((t = e.target.closest("[data-type]"))) {
      var ty = t.dataset.type;
      if (ty === "*") F.types = []; else {
        var kt = F.types.indexOf(ty); if (kt>-1) F.types.splice(kt,1); else F.types.push(ty); }
      render(); return; }
    if ((t = e.target.closest("[data-price]"))) {
      var pr = t.dataset.price;
      if (pr === "*") F.prices = []; else {
        var kp = F.prices.indexOf(pr); if (kp>-1) F.prices.splice(kp,1); else F.prices.push(pr); }
      render(); return; }
    if ((t = e.target.closest("[data-travel]"))) { F.travel = +t.dataset.travel || null; render(); return; }
    if ((t = e.target.closest("[data-area]"))) {
      var a = t.dataset.area;
      if (a === "*") F.areas = []; else {
        var k = F.areas.indexOf(a); if (k>-1) F.areas.splice(k,1); else F.areas.push(a); }
      render(); return; }
    if ((t = e.target.closest("[data-time]"))) {
      var k2 = F.times.indexOf(t.dataset.time); if (k2>-1) F.times.splice(k2,1); else F.times.push(t.dataset.time);
      render(); return; }
    if ((t = e.target.closest("[data-tog]"))) { F[t.dataset.tog] = !F[t.dataset.tog]; render(); return; }
    if ((t = e.target.closest("[data-clear]"))) {
      // Clear the filters, keep the category. Someone narrowing Food and hitting Clear all
      // wants the 51 restaurants back, not the whole catalogue.
      clearFilters(); F.q=""; F.mood=null;
      render(); return; }
    if ((t = e.target.closest("[data-clearq]"))) { F.q=""; render(); return; }
    if ((t = e.target.closest("[data-fold]"))) { t.parentNode.classList.toggle("closed"); return; }
    if ((t = e.target.closest("[data-gal]"))) {
      var p = byId[route.arg]; if (!p||!p.images.length) return;
      galIdx = (galIdx + (+t.dataset.gal) + p.images.length) % p.images.length; render(); return; }
    if ((t = e.target.closest("[data-goto]"))) { galIdx = +t.dataset.goto; render(); return; }
    if ((t = e.target.closest("[data-mapf]"))) { mapFilter = t.dataset.mapf; mapSel = null; render(); return; }
    if ((t = e.target.closest("[data-open-sheet]"))) { openSheet(); return; }
    if ((t = e.target.closest("[data-close-sheet]"))) { closeSheet(); return; }
    if ((t = e.target.closest("[data-scroll-sugg]"))) {
      var s = el("sugg"); if (s) s.scrollIntoView({behavior:"smooth", block:"center"}); return; }
  }

  function wire(){
  var q = el("q");
  if (q) {
    q.addEventListener("input", debounce(function(){
      F.q = q.value; var pos = q.selectionStart; render();
      var n = el("q"); if (n) { n.focus(); try { n.setSelectionRange(pos,pos); } catch(e){} }
    }, 220));
  }
  var so = el("sort");
  if (so) so.addEventListener("change", function(){ F.sort = so.value; render(); });
  var ma = el("maparea");
  if (ma) ma.addEventListener("change", function(){ mapArea = ma.value; mapSel = null; render(); });
  if (route.view === "map") mountMap();
}

// The popup's "Add to today" button lives inside Leaflet's own popup pane, which sits
// outside #app, so the delegated click handler there never sees it.
// Leaflet measures its container once, when the map is created, and never again on its
// own. Every later change of shape has to be told: a window resize, a phone rotating, a
// mobile address bar collapsing, the desktop sidebar appearing at a breakpoint. Without
// this the map keeps its first pixel box and you get grey bands down one edge and pins
// that no longer sit under the cursor, which reads as a broken map.
var _mapRO = null, _mapResizeBound = false;
function mapNudge(){ if (_map) { try { _map.invalidateSize(false); } catch (e) {} } }
function mapWatchSize(box){
  if (!box || box.nodeType !== 1) box = el("leaf");
  if (!box) return;
  if (!_mapResizeBound){
    _mapResizeBound = true;
    var nudge = debounce(mapNudge, 140);
    window.addEventListener("resize", nudge);
    window.addEventListener("orientationchange", function(){ setTimeout(mapNudge, 320); });
    document.addEventListener("visibilitychange", function(){
      if (!document.hidden) setTimeout(mapNudge, 120);
    });
  }
  if (typeof ResizeObserver === "function"){
    if (_mapRO) { try { _mapRO.disconnect(); } catch (e) {} }
    _mapRO = new ResizeObserver(debounce(mapNudge, 120));
    _mapRO.observe(box);
  }
}

function mountMap(){
  var ids = todayList(S.day||22);
  var list = P.filter(function(p){
    if (p.lat == null || p.lng == null || has("no",p.id)) return false;
    if (mapArea && p.cluster !== mapArea) return false;
    if (mapFilter === "SAVED") return has("saved",p.id);
    if (mapFilter === "TODAY") return ids.indexOf(p.id) > -1;
    if (mapFilter !== "ALL") return p.cat === mapFilter;
    return true;
  });
  buildMap(list);
}
document.addEventListener("click", function(e){
  var t = e.target.closest && e.target.closest(".leaflet-popup [data-add]");
  if (t) { addToday(t.dataset.add); }
});
function debounce(fn, ms){ var t; return function(){ clearTimeout(t); t = setTimeout(fn, ms); }; }

function addToday(id){
  var d = S.day || 22, list = todayList(d);
  if (list.indexOf(id) > -1) { toast("Already on this day"); return; }
  if (list.length >= 4) { toast("Four stops is already a lot. Remove one first"); return; }
  list.push(id); S.today[d] = list; save();
  var p = byId[id];
  toast(p.name + " added to " + d + " Sep");
  if (route.view === "today") render();
}

// ── mobile filter sheet ───────────────────────────────────────────
function openSheet(){
  var bd = el("sheetbd"), sh = el("sheet");
  el("sheetBody").innerHTML = filterPanel(true);
  el("sheetCount").textContent = " (" + P.filter(matches).length + ")";
  bd.classList.add("on"); sh.classList.add("on");
  document.body.style.overflow = "hidden";
  sh.querySelector(".sheet-body").scrollTop = 0;
}
function closeSheet(){
  el("sheetbd").classList.remove("on"); el("sheet").classList.remove("on");
  document.body.style.overflow = "";
}
el("sheetbd").addEventListener("click", closeSheet);
el("sheetClose").addEventListener("click", closeSheet);
el("sheetBody").addEventListener("click", function(e){
  // reuse the same handlers, then repaint both the sheet and the page
  var app = el("app");
  var t = e.target.closest("[data-area],[data-type],[data-price],[data-travel],[data-time],[data-tog],[data-clear],[data-day],[data-fold]");
  if (!t) return;
  if (t.dataset.fold !== undefined) { t.parentNode.classList.toggle("closed"); return; }
  function multi(list, v){
    if (v === "*") return [];
    var k = list.indexOf(v); if (k>-1) list.splice(k,1); else list.push(v); return list;
  }
  if (t.dataset.area !== undefined) { F.areas = multi(F.areas, t.dataset.area);
  } else if (t.dataset.type !== undefined) { F.types = multi(F.types, t.dataset.type);
  } else if (t.dataset.price !== undefined) { F.prices = multi(F.prices, t.dataset.price);
  } else if (t.dataset.travel !== undefined) { F.travel = +t.dataset.travel || null;
  } else if (t.dataset.time !== undefined) { F.times = multi(F.times, t.dataset.time);
  } else if (t.dataset.tog !== undefined) { F[t.dataset.tog] = !F[t.dataset.tog];
  } else if (t.dataset.day !== undefined) { F.openDay = +t.dataset.day || null;
  } else if (t.dataset.clear !== undefined) { clearFilters();
  }
  el("sheetBody").innerHTML = filterPanel(true);
  render();
  el("sheetCount").textContent = " (" + P.filter(matches).length + ")";
});
el("sheetApply").addEventListener("click", closeSheet);
window.addEventListener("keydown", function(e){ if (e.key === "Escape") closeSheet(); });

// ───────────────────────────── boot ─────────────────────────────
el("app").addEventListener("click", onClick);
parseHash();
render();
})();

</script>
