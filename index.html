<style>
/* =========================================================================
   Seoul Side B design system
   Extracted from the four supplied reference screens. See research/DESIGN.md.
   ========================================================================= */

:root{
  --paper:#FAF8F5;
  --surface:#FFFFFF;
  --ink:#16130F;
  --ink-2:#4A443E;
  --ink-3:#8A817A;
  --line:#E8E3DC;
  --line-soft:#F1ECE5;
  --accent:#C0562F;

  --t-rose:#F7DFDA;   --i-rose:#7A3B2C;
  --t-sand:#F6E7D3;   --i-sand:#7A5526;
  --t-sage:#DFE4DC;   --i-sage:#41503F;
  --t-sky:#DAE7F3;    --i-sky:#2E4E6B;
  --t-lilac:#E4E0F0;  --i-lilac:#4A4270;
  --t-mist:#E4E6E7;   --i-mist:#4A4F52;
  --t-amber:#FBF0D8;  --i-amber:#8A6516;
  --t-chip:#EEF1F4;   --i-chip:#5A6169;

  --r-card:12px; --r-btn:10px; --r-pill:999px;
  --shadow:0 1px 2px rgba(22,19,15,.04);
  --maxw:1320px;
  --nav-h:68px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);

  --f-ui:'Poppins','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --f-hand:'Caveat','Segoe Script',cursive;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-ui);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
input,select{font:inherit}
::selection{background:var(--t-rose)}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- icons ---------- */
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
.ic-22{width:22px;height:22px}
.ic-16{width:16px;height:16px}
.ic-24{width:24px;height:24px}

/* =========================  TOP NAV  ========================= */
.topbar{
  position:sticky;top:0;z-index:60;background:var(--surface);
  border-bottom:1px solid var(--line);padding-top:var(--sat);
}
.topbar-in{height:var(--nav-h);display:flex;align-items:center;gap:28px;
  max-width:var(--maxw);margin:0 auto;padding:0 32px}
.brand{display:flex;flex-direction:column;justify-content:center;flex:none}
.brand-name{font-family:var(--f-serif);font-weight:700;font-size:23px;letter-spacing:-.01em;
  line-height:1;display:flex;align-items:center;gap:6px;white-space:nowrap}
.brand-dot{width:7px;height:7px;border:1.6px solid var(--accent);border-radius:50%;display:inline-block}
.brand-sub{font-size:8px;letter-spacing:.18em;color:var(--ink-3);font-weight:500;margin-top:3px}

.nav{display:flex;align-items:center;gap:22px;margin:0 auto;height:100%}
.nav a{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--ink-2);
  height:100%;position:relative;transition:color .15s}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);font-weight:600}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}

.tools{display:flex;align-items:center;gap:12px;flex:none;margin-left:auto}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);
  transition:background .15s}
.iconbtn:hover{background:var(--t-chip)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--t-chip);display:grid;place-items:center;
  color:var(--ink-2);flex:none}
.datechip{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.datechip b{display:block;font-size:13px;font-weight:600;color:var(--ink);line-height:1.25}
.datechip span{display:block;font-size:11px;color:var(--ink-3);line-height:1.25}
.datechip span i{font-style:normal;font-weight:600;color:var(--ink-2)}

/* =========================  HERO BAND  ========================= */
.hero{position:relative;overflow:hidden;background:var(--paper)}
.hero-img{position:absolute;inset:0 0 0 auto;width:56%;height:100%}
.hero-img img{width:100%;height:100%;object-fit:cover}
.hero-img::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,var(--paper) 0%,var(--paper) 10%,rgba(250,248,245,.78) 38%,rgba(250,248,245,.12) 82%,rgba(250,248,245,0) 100%)}
.hero-in{position:relative;max-width:var(--maxw);margin:0 auto;padding:46px 32px 36px;min-height:212px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--ink-3);margin:0 0 14px}
.h1{font-size:56px;line-height:.98;font-weight:800;letter-spacing:-.03em;margin:0;max-width:16ch}
.hero-sub{font-size:18px;color:var(--ink-2);margin:14px 0 0;max-width:58ch;font-weight:400}
.hand{position:absolute;right:7%;top:30px;font-family:var(--f-hand);font-size:28px;color:#5C544C;
  transform:rotate(-4deg);line-height:1.2;text-align:left;z-index:3;pointer-events:none;max-width:34%;
  text-shadow:0 1px 3px rgba(250,248,245,.95),0 0 18px rgba(250,248,245,.9),0 0 34px rgba(250,248,245,.75)}

/* =========================  MOOD BUTTONS  ========================= */
.moods{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:24px 0 0}
.mood{display:flex;align-items:center;gap:9px;height:72px;padding:0 12px;border-radius:var(--r-card);
  font-weight:600;font-size:13.5px;line-height:1.15;letter-spacing:-.015em;text-align:left;
  transition:transform .14s,filter .14s}
.mood > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mood:hover{transform:translateY(-1px);filter:brightness(.97)}
.mood .ar{margin-left:auto;opacity:.5;margin-inline-start:6px}
.mood.rose{background:var(--t-rose);color:var(--i-rose)}
.mood.sand{background:var(--t-sand);color:var(--i-sand)}
.mood.sage{background:var(--t-sage);color:var(--i-sage)}
.mood.sky{background:var(--t-sky);color:var(--i-sky)}
.mood.lilac{background:var(--t-lilac);color:var(--i-lilac)}
.mood.mist{background:var(--t-mist);color:var(--i-mist)}

/* =========================  SECTION HEADS  ========================= */
.sec{margin:38px 0 0}
.sec-h{display:flex;align-items:baseline;gap:14px;margin:0 0 16px;flex-wrap:wrap}
.sec-h h2{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
.sec-h .dash{color:var(--ink-3);font-size:14px}
.sec-h .more{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--ink-2);display:flex;
  align-items:center;gap:5px}
.sec-h .more:hover{color:var(--ink)}

/* =========================  PLACE CARD  ========================= */
.grid{display:grid;gap:16px}
.g6{grid-template-columns:repeat(6,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  overflow:hidden;display:flex;flex-direction:column;text-align:left;width:100%;
  transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,19,15,.07);border-color:#DED7CE}
.card-ph{position:relative;aspect-ratio:4/3;background:var(--t-chip);flex:none;overflow:hidden}
.card-ph img{width:100%;height:100%;object-fit:cover}
.ph-fb{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);gap:6px}
.ph-fb span{font-size:11px;font-weight:600;letter-spacing:.1em}
.heart{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;
  background:rgba(22,19,15,.45);backdrop-filter:blur(3px);display:grid;place-items:center;color:#fff;z-index:2}
.heart:hover{background:rgba(22,19,15,.65)}
.heart.on{background:#fff;color:var(--accent)}
.heart.on .ic{fill:currentColor}
.card-b{padding:14px 15px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.card-t{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.25;margin:0}
.card-w{font-size:13.5px;color:var(--ink-2);margin:0;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);margin-top:auto;padding-top:4px}
.meta i{display:inline-flex;align-items:center;gap:5px;font-style:normal;white-space:nowrap}
.meta .ic{width:15px;height:15px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--t-chip);color:var(--i-chip);font-size:11.5px;font-weight:500;
  padding:5px 10px;border-radius:var(--r-pill);white-space:nowrap}
.chip.rose{background:var(--t-rose);color:var(--i-rose)}
.chip.sand{background:var(--t-sand);color:var(--i-sand)}
.chip.sage{background:var(--t-sage);color:var(--i-sage)}
.chip.sky{background:var(--t-sky);color:var(--i-sky)}
.chip.amber{background:var(--t-amber);color:var(--i-amber)}

/* =========================  BUTTONS  ========================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;
  border-radius:var(--r-btn);font-size:14px;font-weight:600;transition:filter .15s,transform .12s}
.btn:active{transform:scale(.985)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{filter:brightness(1.35)}
.btn-line{background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.btn-line:hover{border-color:#D6CEC3;color:var(--ink)}
.btn-rose{background:var(--t-rose);color:var(--i-rose)}
.btn-sand{background:var(--t-sand);color:var(--i-sand)}
.btn-sky{background:var(--t-sky);color:var(--i-sky)}
.btn-rose:hover,.btn-sand:hover,.btn-sky:hover{filter:brightness(.96)}
.btn-full{width:100%}
.btn-pill{border-radius:var(--r-pill)}

/* =========================  8-DAY STRIP  ========================= */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px 22px}
.panel-h{display:flex;align-items:center;gap:12px;margin-bottom:3px}
.panel-h h3{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0}
.panel-h .more{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.panel-sub{font-size:13px;color:var(--ink-3);margin:0 0 16px}
.days{display:grid;grid-template-columns:repeat(9,1fr);gap:10px}
.day{border:1px solid var(--line);border-radius:10px;padding:11px 40px 13px 12px;background:var(--surface);
  text-align:left;position:relative;transition:border-color .15s,background .15s}
.day:hover{border-color:#D6CEC3;background:#FDFCFA}
.day .dow{font-size:11px;color:var(--ink-3);font-weight:500}
.day .dnum{font-size:14px;font-weight:700;letter-spacing:-.01em;margin-top:1px}
.day .dlab{font-size:11.5px;color:var(--ink-2);margin-top:7px;line-height:1.3}
.day .dic{position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:7px;
  display:grid;place-items:center}
.day .dic.t-rose{background:var(--t-rose);color:var(--i-rose)}
.day .dic.t-sand{background:var(--t-sand);color:var(--i-sand)}
.day .dic.t-sage{background:var(--t-sage);color:var(--i-sage)}
.day .dic.t-sky{background:var(--t-sky);color:var(--i-sky)}
.day .dic.t-chip{background:var(--t-chip);color:var(--i-chip)}
.day.hol{background:#FEFBF4;border-color:#F0E4CC}
.day.hol{background:#FEFBF4;border-color:#F0E4CC}
.day.hol .dnum{color:var(--i-amber)}

/* =========================  CLOSING BAND  ========================= */
.band{position:relative;border-radius:var(--r-card);overflow:hidden;margin:36px 0 56px;min-height:138px;
  display:flex;align-items:center}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.band::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(250,248,245,.98) 0%,rgba(250,248,245,.94) 34%,rgba(250,248,245,.45) 70%,rgba(250,248,245,.18) 100%)}
.band-in{position:relative;z-index:2;padding:24px 28px;display:flex;align-items:center;gap:20px;width:100%}
.band-in h3{font-family:var(--f-serif);font-size:31px;font-weight:700;margin:0;letter-spacing:-.015em}
.band-in p{margin:6px 0 0;font-size:14px;color:var(--ink-2)}

/* =========================  FILTER RAIL  ========================= */
.cols{display:grid;grid-template-columns:272px 1fr;gap:26px;align-items:start;margin-top:24px}
.rail{position:sticky;top:calc(var(--nav-h) + var(--sat) + 18px)}
.frow{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.frow h3{font-size:17px;font-weight:700;margin:0}
.frow .clear{margin-left:auto;font-size:13px;color:var(--ink-3)}
.frow .clear:hover{color:var(--ink-2)}
.fgroup{border-top:1px solid var(--line-soft);padding:14px 0 4px;margin-top:12px}
.fgroup:first-of-type{border-top:0}
.fgroup > button{display:flex;align-items:center;width:100%;font-size:15px;font-weight:700;margin-bottom:8px}
.fgroup > button .ar{margin-left:auto;color:var(--ink-3);transition:transform .2s}
.fgroup.closed > button .ar{transform:rotate(-90deg)}
.fgroup.closed .fbody{display:none}
.opt{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;width:100%;
  font-size:13.5px;color:var(--ink-2);transition:background .14s}
.opt:hover{background:#FBF9F6}
.opt.on{background:var(--t-rose);color:var(--i-rose);font-weight:500}
.box{width:16px;height:16px;border:1.5px solid #CFC7BC;border-radius:5px;flex:none;display:grid;place-items:center;
  background:var(--surface);transition:all .14s}
.opt.on .box{background:var(--accent);border-color:var(--accent);color:#fff}
.box .ic{width:11px;height:11px;stroke-width:3;opacity:0}
.opt.on .box .ic{opacity:1}
.tog{display:flex;align-items:center;gap:10px;padding:9px 2px;width:100%;font-size:13.5px;color:var(--ink-2)}
.tog .ic{color:var(--ink-3)}
.tog .lab{text-align:left;line-height:1.25}
.tog .lab small{display:block;font-size:11px;color:var(--ink-3)}
.sw{margin-left:auto;width:38px;height:22px;border-radius:var(--r-pill);background:#DCD5CB;position:relative;
  flex:none;transition:background .18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform .18s}
.tog.on .sw{background:var(--ink)}
.tog.on .sw::after{transform:translateX(16px)}

/* segmented + sort */
.seg{display:inline-flex;background:var(--t-chip);border-radius:var(--r-pill);padding:4px;gap:2px}
.seg button{padding:8px 16px;border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--i-chip);
  transition:all .16s;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.sortwrap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.sortwrap select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-btn);
  padding:9px 12px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}

/* =========================  DETAIL  ========================= */
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);padding:16px 0 14px;flex-wrap:wrap}
.crumb a:hover{color:var(--ink-2)}
.crumb .back{margin-left:auto;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:5px}

.dcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;align-items:start}
.gal{display:grid;grid-template-columns:2.15fr 1fr;gap:8px;height:452px}
.gal-main{position:relative;border-radius:var(--r-card);overflow:hidden;background:var(--t-chip)}
.gal-main img{width:100%;height:100%;object-fit:cover}
.gal-side{display:grid;grid-template-rows:repeat(3,1fr);gap:8px;min-height:0}
.gal-side .t{position:relative;border-radius:var(--r-card);overflow:hidden;background:var(--t-chip)}
.gal-side .t img{width:100%;height:100%;object-fit:cover}
.gal-more{position:absolute;inset:0;background:rgba(22,19,15,.5);color:#fff;display:grid;place-items:center;
  font-size:14px;font-weight:600}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink);z-index:2;
  box-shadow:0 2px 8px rgba(0,0,0,.14)}
.gnav.l{left:12px}.gnav.r{right:12px}
.gpill{position:absolute;bottom:12px;background:rgba(22,19,15,.55);color:#fff;font-size:12px;font-weight:500;
  padding:6px 11px;border-radius:var(--r-pill);display:flex;align-items:center;gap:5px;z-index:2}
.gpill.l{left:12px}.gpill.r{right:12px}

.d-h1{font-size:40px;font-weight:800;letter-spacing:-.025em;line-height:1.06;margin:12px 0 0}
.d-kr{font-size:15px;color:var(--ink-3);margin:6px 0 0;font-weight:500}
.d-lead{font-size:19px;color:var(--ink-2);margin:14px 0 0;line-height:1.45}
.d-body{font-size:15px;color:var(--ink-2);margin:12px 0 0;line-height:1.6}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px;margin:22px 0 0}
.stat{display:flex;gap:11px;align-items:flex-start}
.stat .ic{color:var(--ink-2);margin-top:2px}
.stat b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.stat span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}

.rates{display:flex;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;
  background:var(--surface);margin:20px 0 0}
.rate{flex:1;padding:13px 14px;display:flex;align-items:center;gap:10px;border-left:1px solid var(--line)}
.rate:first-child{border-left:0}
.rate-m{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px}
.rate-m.naver{background:#03C75A;color:#fff;font-family:var(--f-ui)}
.rate-m.google{background:#fff;border:1px solid var(--line)}
.rate-t{min-width:0}
.rate-t .p{font-size:11.5px;color:var(--ink-3);line-height:1.2}
.rate-t .s{font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:4px;line-height:1.25}
.rate-t .s em{font-style:normal;color:#E8A317;font-size:14px}
.rate-t .c{font-size:11.5px;color:var(--ink-3);line-height:1.2}
.dacts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 0}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:16px 8px 11px;text-align:center;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:92px}
.tile .bw{font-weight:800;font-size:15px;letter-spacing:.01em;color:var(--ink);line-height:1.1;
  display:flex;align-items:center;justify-content:center;min-height:22px;text-align:center;padding:0 2px}
.tile .lb{font-size:11px;color:var(--ink-3);line-height:1.25}
.tile .ic{color:var(--ink-2)}

.nrow{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-soft)}
.nrow:first-of-type{border-top:0;padding-top:4px}
.nrow-ph{width:96px;height:72px;border-radius:9px;overflow:hidden;background:var(--t-chip);flex:none}
.nrow-ph img{width:100%;height:100%;object-fit:cover}
.nrow-b{min-width:0;flex:1}
.walk{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px;margin-bottom:3px}
.nrow-b h4{font-size:15px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em}
.nrow-b p{font-size:13px;color:var(--ink-2);margin:0 0 7px;line-height:1.4}
.mini{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);width:100%;text-align:left}
.mini-ph{width:56px;height:44px;border-radius:7px;overflow:hidden;background:var(--t-chip);flex:none}
.mini-ph img{width:100%;height:100%;object-fit:cover}
.mini b{display:block;font-size:13px;font-weight:600;line-height:1.25}
.mini span{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:4px;margin-top:2px}

/* =========================  PLAN  ========================= */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 0}
.tab{display:flex;align-items:center;gap:9px;padding:14px 20px;border-radius:var(--r-card);
  background:var(--t-chip);color:var(--i-chip);font-size:14.5px;font-weight:600;transition:filter .15s}
.tab:hover{filter:brightness(.97)}
.tab.on{background:var(--t-rose);color:var(--i-rose)}

.pcols{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:22px;align-items:start;margin-top:20px}
.dayrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:13px 14px;
  display:flex;align-items:stretch;gap:0;margin-bottom:12px}
.dayrow.hol{border-color:#EFE1C7;background:#FFFDF8}
.dl{width:92px;flex:none;padding-right:12px}
.dl .a{font-size:11.5px;color:var(--ink-3)}
.dl .b{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin-top:1px}
.dl .c{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.dl .hb{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:10.5px;font-weight:700;
  background:var(--t-amber);color:var(--i-amber);padding:3px 7px;border-radius:var(--r-pill)}
.stops{display:flex;flex:1;min-width:0;gap:0}
.stop{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:0 12px;
  border-left:1px solid var(--line-soft);text-align:left}
.stop-ph{width:56px;height:48px;border-radius:8px;overflow:hidden;background:var(--t-chip);flex:none}
.stop-ph img{width:100%;height:100%;object-fit:cover}
.stop-b{min-width:0;flex:1}
.stop-b b{display:block;font-size:13.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.stop-b span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.stop .ar{color:var(--ink-3);flex:none}
.stop.ret{flex:0 0 150px}
.stop.ret .ic{color:var(--ink-2)}

.build{position:sticky;top:calc(var(--nav-h) + var(--sat) + 18px)}
.stepper{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-btn);
  padding:10px 12px;margin:14px 0}
.stepper .t{flex:1;text-align:center;font-size:13.5px;font-weight:600}
.stepper button{color:var(--ink-2);display:grid;place-items:center;width:26px;height:26px;border-radius:6px}
.stepper button:hover{background:var(--t-chip)}
.tl{display:flex;flex-direction:column;gap:2px}
.tli{display:flex;align-items:center;gap:11px;padding:8px 4px;border-radius:9px}
.tli:hover{background:#FBF9F6}
.tli .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;
  font-size:11.5px;font-weight:700;color:var(--ink-2);flex:none;background:var(--surface)}
.tli-ph{width:42px;height:42px;border-radius:9px;overflow:hidden;background:var(--t-chip);flex:none}
.tli-ph img{width:100%;height:100%;object-fit:cover}
.tli-ph.ti{display:grid;place-items:center;color:var(--i-sand);background:var(--t-sand)}
.tli-ph.ho{display:grid;place-items:center;color:var(--ink-2);background:var(--t-chip)}
.tli-b{min-width:0;flex:1}
.tli-b b{display:block;font-size:13.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.tli-b span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.tli .x{width:24px;height:24px;display:grid;place-items:center;color:var(--ink-3);border-radius:6px;flex:none}
.tli .x:hover{background:var(--t-rose);color:var(--i-rose)}
.addstop{display:flex;align-items:center;gap:11px;padding:8px 4px;width:100%;text-align:left}
.addstop .dash{width:34px;height:34px;border-radius:50%;border:1.5px dashed #D2CAC0;display:grid;place-items:center;
  color:var(--ink-3);margin-left:5px;flex:none}
.addstop span{font-size:13.5px;color:var(--ink-3)}
.addstop .pl{margin-left:auto;color:var(--ink-3)}
.warn{display:flex;gap:11px;align-items:flex-start;background:var(--t-amber);border-radius:var(--r-btn);
  padding:13px 14px;margin:14px 0}
.warn .ic{color:var(--i-amber);flex:none;margin-top:1px}
.warn b{display:block;font-size:13.5px;font-weight:700;color:var(--i-amber);letter-spacing:-.01em}
.warn p{margin:3px 0 0;font-size:12.5px;color:#7A5A15;line-height:1.45}

/* =========================  MAP  ========================= */
.mapwrap{position:relative;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;
  background:#EFEBE4;height:min(72vh,640px);margin-top:20px}
.mapcanvas{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-50%);z-index:3}
.dot{width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;display:grid;place-items:center;
  box-shadow:0 1px 4px rgba(22,19,15,.35);position:relative;transition:transform .13s}
.dot::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;
  transform:translate(-50%,-50%);border-radius:50%}
.dot:hover,.dot:focus-visible{transform:scale(1.35);z-index:9}
.dot.sel{transform:scale(1.45);box-shadow:0 0 0 4px rgba(22,19,15,.16),0 1px 4px rgba(22,19,15,.4);z-index:9}
.dot .tip{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:6px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .13s;max-width:190px;overflow:hidden;
  text-overflow:ellipsis}
.dot:hover .tip,.dot:focus-visible .tip{opacity:1}
.dot.SHOP{background:var(--accent)}.dot.EAT{background:#B5822B}.dot.DO{background:#4C6B54}
.dot.VIEW{background:#3D6288}.dot.EVENT{background:#6E5E9E}
.dot.HOME{background:var(--ink);width:30px;height:30px;color:#fff;z-index:6}
.d.SHOP{background:var(--accent)}.d.EAT{background:#B5822B}.d.DO{background:#4C6B54}
.d.VIEW{background:#3D6288}.d.EVENT{background:#6E5E9E}
.maplg{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.95);border:1px solid var(--line);
  border-radius:var(--r-btn);padding:10px 12px;font-size:11.5px;color:var(--ink-2);z-index:6;
  display:flex;flex-direction:column;gap:6px}
.maplg i{display:flex;align-items:center;gap:7px;font-style:normal}
.maplg .d{width:9px;height:9px;border-radius:50%;flex:none}
.mappop{position:absolute;z-index:12;width:236px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-card);overflow:hidden;box-shadow:0 10px 32px rgba(22,19,15,.22)}
.popx{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;
  background:rgba(22,19,15,.55);color:#fff;display:grid;place-items:center;z-index:2}
.mappop img{width:100%;height:104px;object-fit:cover}

/* =========================  EMPTY / MISC  ========================= */
.empty{text-align:center;padding:64px 20px;color:var(--ink-3)}
.empty h3{font-size:19px;font-weight:700;color:var(--ink-2);margin:12px 0 6px}
.empty p{margin:0;font-size:14px;max-width:44ch;margin-inline:auto}
.cnt{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.cnt-s{font-size:13.5px;color:var(--ink-3);margin:3px 0 0}
.rowtop{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.rowtop .rt{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(22px + var(--sab));transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:12px 20px;border-radius:var(--r-pill);font-size:13.5px;font-weight:600;z-index:200;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* holiday banner */
.holbar{display:flex;gap:12px;align-items:flex-start;background:var(--t-amber);border-radius:var(--r-card);
  padding:14px 16px;margin:20px 0 0}
.holbar .ic{color:var(--i-amber);flex:none;margin-top:1px}
.holbar b{font-size:14px;font-weight:700;color:var(--i-amber);display:block;letter-spacing:-.01em}
.holbar p{margin:3px 0 0;font-size:13px;color:#7A5A15;line-height:1.5}

/* mobile-only chrome: hidden entirely above the breakpoint */
.tabbar{display:none}
.sheet-bd{display:none}
.sheet{display:none}
.fabfilter{display:none}

/* =========================  RESPONSIVE  ========================= */
@media (max-width:1100px){
  .g6{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(3,1fr)}
  .pcols{grid-template-columns:1fr}
  .build{position:static}
  .h1{font-size:46px}
}
@media (max-width:900px){
  .nav{display:none}
  .dcols{grid-template-columns:1fr;gap:22px}
  .gal{height:330px}
  .g3{grid-template-columns:1fr}
  .days{grid-template-columns:repeat(5,1fr)}
}
@media (max-width:820px){
  :root{--nav-h:56px}
  .wrap,.topbar-in,.hero-in{padding-left:18px;padding-right:18px}
  .brand-name{font-size:20px}
  .hero-in{padding-top:30px;padding-bottom:26px;min-height:0}
  .hero-img{width:100%;opacity:.42}
  .hero-img::after{background:linear-gradient(180deg,rgba(250,248,245,.55) 0%,rgba(250,248,245,.9) 62%,var(--paper) 100%)}
  .hand{display:none}
  .h1{font-size:34px;max-width:none}
  .hero-sub{font-size:15.5px;margin-top:10px}
  .eyebrow{font-size:10px;margin-bottom:10px}
  .moods{grid-template-columns:1fr 1fr;gap:10px}
  .mood{height:64px;font-size:14px;padding:0 14px;gap:10px}
  .sec-h h2{font-size:23px}
  .cnt{font-size:22px}
  .g6,.g4{grid-template-columns:1fr}
  .card-ph{aspect-ratio:16/10}
  .cols{grid-template-columns:1fr;gap:0}
  .rail{display:none}
  .days{display:flex;overflow-x:auto;gap:9px;scroll-snap-type:x mandatory;
    margin:0 -18px;padding:2px 18px 6px;-webkit-overflow-scrolling:touch}
  .day{flex:0 0 118px;scroll-snap-align:start}
  .panel{padding:16px}
  .d-h1{font-size:29px}
  .d-lead{font-size:16.5px}
  .gal{grid-template-columns:1fr;height:auto}
  .gal-side{display:none}
  .gal-main{aspect-ratio:4/3;height:auto}
  .stats{gap:15px 14px}
  .dacts{grid-template-columns:1fr 1fr}
  .dacts .btn:first-child{grid-column:span 2}
  .rates{flex-direction:column}
  .rate{border-left:0;border-top:1px solid var(--line)}
  .rate:first-child{border-top:0}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .dayrow{flex-direction:column;gap:2px}
  .dl{width:auto;display:flex;align-items:center;gap:9px;padding:0 4px 8px}
  .dl .b{font-size:15px}
  .dl .a,.dl .c{font-size:12px}
  .dl .hb{margin-top:0;margin-left:auto}
  .stops{flex-direction:column;gap:0}
  .stop{border-left:0;border-top:1px solid var(--line-soft);padding:9px 4px}
  .stop.ret{flex:none}
  .band{min-height:0}
  .band-in{flex-direction:column;align-items:flex-start;gap:14px;padding:20px}
  .band-in h3{font-size:23px}
  .band::after{background:linear-gradient(90deg,rgba(247,243,236,.97) 0%,rgba(247,243,236,.9) 62%,rgba(247,243,236,.55) 100%)}
  .rowtop .rt{margin-left:0;width:100%}
  .seg{flex:1}
  .seg button{flex:1;text-align:center}
  .mapwrap{height:66vh}
  .dot{width:24px;height:24px}
  .dot.HOME{width:34px;height:34px}
  .dot::after{width:46px;height:46px}
  .dot .tip{display:none}
  .mappop{width:200px}

  /* top bar must not push the page sideways at 375px */
  .topbar-in{gap:10px}
  .brand{min-width:0;overflow:hidden}
  .brand-name{font-size:18px;gap:5px}
  .brand-sub{font-size:7px;letter-spacing:.14em}
  .tools{gap:4px;min-width:0}
  .avatar{display:none}
  .datechip{min-width:0}
  .datechip .ic{display:none}
  .datechip b{font-size:12px;white-space:nowrap}
  .datechip span span{display:none}

  /* touch targets: nothing interactive under 44px */
  .iconbtn{width:44px;height:44px}
  .heart{width:40px;height:40px;top:8px;right:8px}
  .stepper button{width:40px;height:40px}
  .opt{min-height:44px}
  .tog{min-height:48px}
  .frow .clear,.sec-h .more,.panel-h .more,.crumb .back,.crumb a{
    min-height:44px;display:inline-flex;align-items:center}
  .tli .x{width:40px;height:40px}
  .seg button{min-height:44px}
  .gnav{width:44px;height:44px}
  .brand{min-height:44px;justify-content:center}
  .card-b > a{display:flex;align-items:center;min-height:40px;padding:2px 0}
  .card-b .btn{height:44px!important}
  #q{min-height:40px}

  .mealink{display:flex;align-items:center;min-height:44px}

  /* bottom tab bar */
  body{padding-bottom:calc(64px + var(--sab))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);
    border-top:1px solid var(--line);padding-bottom:var(--sab)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    height:64px;font-size:10.5px;font-weight:600;color:var(--ink-3)}
  .tabbar a.on{color:var(--ink)}
  .tabbar a.on .ic{stroke-width:2}
  .fabfilter{display:inline-flex;position:fixed;right:16px;bottom:calc(78px + var(--sab));z-index:65;height:46px;padding:0 20px;
    border-radius:var(--r-pill);background:var(--ink);color:#fff;font-weight:600;font-size:14px;
    display:inline-flex;align-items:center;gap:8px;box-shadow:0 5px 18px rgba(22,19,15,.26)}

  /* filter bottom sheet */
  .sheet-bd{display:block;position:fixed;inset:0;background:rgba(22,19,15,.42);z-index:90;opacity:0;
    pointer-events:none;transition:opacity .24s}
  .sheet-bd.on{opacity:1;pointer-events:auto}
  .sheet{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:95;background:var(--surface);
    border-radius:18px 18px 0 0;max-height:86vh;display:flex;flex-direction:column;
    transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
  .sheet.on{transform:none}
  .sheet-grab{padding:10px 0 4px;display:grid;place-items:center;flex:none}
  .sheet-grab i{width:38px;height:4px;border-radius:2px;background:#DCD5CB;display:block}
  .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 10px;flex:1;min-height:0}
  .sheet-foot{flex:none;padding:12px 18px calc(14px + var(--sab));border-top:1px solid var(--line);
    background:var(--surface)}
}
@media (max-width:420px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .h1{font-size:30px}
  .stats{grid-template-columns:1fr}
  .dacts{grid-template-columns:1fr}
  .dacts .btn:first-child{grid-column:auto}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* =========================================================================
   Seoul Side B, v2 presentation layer.
   Loaded after styles.css and overrides it. Same tokens, different composition:
   plans instead of a card catalog, mixed card sizes, larger photography,
   fewer borders, depth from shadow rather than outline.
   ========================================================================= */

:root{
  --lift-1:0 1px 2px rgba(22,19,15,.05), 0 2px 8px rgba(22,19,15,.045);
  --lift-2:0 2px 6px rgba(22,19,15,.06), 0 12px 30px rgba(22,19,15,.09);
  --lift-3:0 4px 12px rgba(22,19,15,.08), 0 22px 56px rgba(22,19,15,.13);
  --ink-scrim:linear-gradient(to top, rgba(14,11,9,.88) 0%, rgba(14,11,9,.62) 34%, rgba(14,11,9,.12) 68%, rgba(14,11,9,0) 100%);
}

/* ---------- hero: shorter, photo carries more ---------- */
.hero-in{padding:34px 32px 26px;min-height:0}
.h1{font-size:50px;letter-spacing:-.034em}
.hero-sub{font-size:17px;margin-top:11px;max-width:52ch}
.eyebrow{margin-bottom:11px}
.hero-img{width:50%}

/* ---------- compact holiday notice, replaces the yellow slab ---------- */
.holnote{display:inline-flex;align-items:center;gap:10px;margin:18px 0 0;padding:9px 8px 9px 14px;
  background:var(--surface);border-radius:var(--r-pill);box-shadow:var(--lift-1);
  font-size:13px;color:var(--ink-2);max-width:100%}
.holnote .dot{width:7px;height:7px;border-radius:50%;background:var(--i-amber);flex:none}
.holnote b{font-weight:700;color:var(--ink);white-space:nowrap}
.holnote .sep{color:var(--line);flex:none}
.holnote span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.holnote a{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--ink);
  background:var(--t-chip);padding:6px 12px;border-radius:var(--r-pill);white-space:nowrap;flex:none}
.holnote a:hover{background:var(--t-amber);color:var(--i-amber)}

/* ---------- moods: tinted tiles with a watermark, not form buttons ---------- */
.moods{gap:10px;margin-top:22px}
.mood{position:relative;overflow:hidden;height:104px;padding:14px 14px 12px;align-items:flex-start;
  flex-direction:column;justify-content:flex-end;gap:0;box-shadow:none;border-radius:14px}
.mood:hover{transform:translateY(-2px);filter:none;box-shadow:var(--lift-2)}
.mood .wm{position:absolute;right:-14px;top:-12px;width:78px;height:78px;opacity:.17;
  stroke-width:1.25;pointer-events:none}
.mood .ar{display:none}
.mood > span{white-space:normal;font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.15;
  position:relative;z-index:1}
.mood .n{font-size:11.5px;font-weight:600;opacity:.66;margin-top:3px;position:relative;z-index:1}
.mood .ic-22{position:relative;z-index:1;margin-bottom:auto}

/* ---------- section heads ---------- */
.sec{margin-top:46px}
.sec-h h2{font-size:30px;letter-spacing:-.028em}
.sec-h .dash{font-size:13.5px}

/* ---------- PLANS ---------- */
.plans{display:grid;grid-template-columns:1.06fr .94fr;gap:16px;align-items:stretch}
.plan-side{display:grid;grid-template-rows:1fr 1fr;gap:16px;min-width:0}

.plan{position:relative;border-radius:16px;overflow:hidden;background:var(--surface);
  box-shadow:var(--lift-1);text-align:left;display:block;width:100%;
  transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s}
.plan:hover{transform:translateY(-3px);box-shadow:var(--lift-3)}
.plan img{width:100%;height:100%;object-fit:cover;display:block}

/* featured: full-bleed photo, text over a scrim */
.plan-hero{min-height:492px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}
.plan-hero .bg{position:absolute;inset:0}
.plan-hero .bg::after{content:"";position:absolute;inset:0;background:var(--ink-scrim)}
.plan-hero .in{position:relative;z-index:2;padding:26px 26px 24px}
.plan-hero .kicker{font-size:11px;font-weight:700;letter-spacing:.15em;opacity:.82;margin-bottom:9px}
.plan-hero h3{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.04;margin:0}
.plan-hero .why{font-size:15px;line-height:1.5;margin:10px 0 0;opacity:.94;max-width:46ch}

/* stops rail */
.stoprail{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.stopchip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:var(--r-pill);
  font-size:12px;font-weight:600;background:rgba(255,255,255,.16);backdrop-filter:blur(2px);color:#fff}
.stopchip i{width:22px;height:22px;border-radius:50%;overflow:hidden;flex:none;display:block;background:rgba(255,255,255,.2)}
.stopchip i img{width:100%;height:100%;object-fit:cover}
.plan-light .stopchip{background:var(--t-chip);color:var(--i-chip)}

/* meta line */
.planmeta{display:flex;flex-wrap:wrap;gap:6px 16px;margin:16px 0 0;font-size:12.5px;font-weight:600}
.planmeta i{display:inline-flex;align-items:center;gap:6px;font-style:normal;opacity:.92}
.planmeta .ic{width:15px;height:15px}
.plan-light .planmeta{color:var(--ink-2);opacity:1}

/* secondary: photo left, text right */
.plan-row{display:grid;grid-template-columns:40% 1fr;min-height:0}
.plan-row .ph{position:relative;overflow:hidden}
.plan-row .in{padding:19px 20px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.plan-row h3{font-size:19px;font-weight:700;letter-spacing:-.022em;line-height:1.2;margin:0}
.plan-row .kicker{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--ink-3);margin-bottom:7px}
.plan-row .why{font-size:13.5px;color:var(--ink-2);line-height:1.46;margin:7px 0 0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.plan-row .stoprail{margin-top:11px;gap:6px}
.plan-row .stopchip{font-size:11.5px;padding:4px 9px 4px 4px}
.plan-row .stopchip i{width:19px;height:19px}
.plan-row .planmeta{margin-top:11px;gap:4px 13px;font-size:12px}

/* compact alternatives */
.plan-mini{display:flex;flex-direction:column}
.plan-mini .ph{position:relative;aspect-ratio:16/10;overflow:hidden;flex:none}
.plan-mini .in{padding:14px 15px 16px}
.plan-mini .kicker{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--ink-3)}
.plan-mini h3{font-size:16.5px;font-weight:700;letter-spacing:-.02em;margin:5px 0 0;line-height:1.22}
.plan-mini .why{font-size:13px;color:var(--ink-2);line-height:1.45;margin:6px 0 0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plan-mini .planmeta{margin-top:10px;font-size:12px;color:var(--ink-2)}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}

/* suitability pill sitting on the photo */
.suit{position:absolute;top:12px;left:12px;z-index:3;display:inline-flex;align-items:center;gap:6px;
  padding:6px 11px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;letter-spacing:.01em;
  background:rgba(255,255,255,.94);color:var(--ink);box-shadow:var(--lift-1)}
.suit .ic{width:13px;height:13px}
.suit.rain{background:#DCE8F4;color:var(--i-sky)}
.suit.easy{background:#DFE9DF;color:var(--i-sage)}
.suit.big{background:#EDE6F5;color:var(--i-lilac)}
.suit.new{background:#F8DFD9;color:var(--i-rose)}

/* ---------- card tweaks so the rest matches the new language ---------- */
.card{border:0;box-shadow:var(--lift-1);border-radius:14px}
.card:hover{box-shadow:var(--lift-2);border:0}
.panel{border:0;box-shadow:var(--lift-1);border-radius:14px}
.rates,.tile,.mini,.dayrow,.stepper{border-color:var(--line-soft)}

/* ---------- day strip: arrival and departure read differently ---------- */
.days{gap:9px}
.day{border:0;box-shadow:var(--lift-1);padding:12px 40px 14px 13px;border-radius:11px}
.day:hover{box-shadow:var(--lift-2);background:var(--surface)}
.day.edge{background:#F4F1EC;box-shadow:none}
.day.edge .dnum{color:var(--ink-2)}
.day .part{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--ink-3);margin-top:5px;display:block}

/* ---------- closing band ---------- */
.band{min-height:150px;box-shadow:var(--lift-1)}
.band-in h3{font-size:32px}

/* =========================  RESPONSIVE  ========================= */
@media (max-width:1100px){
  .plans{grid-template-columns:1fr}
  .plan-hero{min-height:392px}
  .plan-side{grid-template-rows:auto auto}
  .minis{grid-template-columns:repeat(2,1fr)}
  .h1{font-size:44px}
}
@media (max-width:820px){
  .hero-in{padding:26px 18px 22px}
  .h1{font-size:33px;letter-spacing:-.03em}
  .hero-sub{font-size:15px}
  .moods{grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
  .mood{height:92px;padding:12px 12px 11px;border-radius:13px}
  .mood > span{font-size:14px}
  .mood .wm{width:64px;height:64px;right:-12px;top:-10px}
  .sec{margin-top:34px}
  .sec-h h2{font-size:23px}

  .holnote{display:flex;width:100%;border-radius:14px;padding:11px 12px;gap:9px;align-items:flex-start;
    flex-wrap:wrap}
  .holnote .dot{margin-top:6px}
  .holnote span{white-space:normal;flex:1 1 100%;order:3;font-size:12.5px;line-height:1.4}
  .holnote .sep{display:none}
  .holnote a{order:2;margin-left:auto;padding:0 14px;min-height:44px;align-items:center}

  .plans{gap:13px}
  .plan-hero{min-height:360px}
  .plan-hero .in{padding:20px}
  .plan-hero h3{font-size:27px}
  .plan-hero .why{font-size:14px}
  .plan-row{grid-template-columns:38% 1fr}
  .plan-row .in{padding:14px 15px}
  .plan-row h3{font-size:17px}
  .plan-row .why{-webkit-line-clamp:2;font-size:13px}
  .minis{grid-template-columns:1fr;gap:13px}
  .plan-mini .ph{aspect-ratio:16/9}
  .band{min-height:0}
  .band-in h3{font-size:24px}
  .days{gap:9px}
  .day{flex:0 0 126px}
}
@media (max-width:420px){
  .plan-row{grid-template-columns:1fr}
  .plan-row .ph{aspect-ratio:16/9}
  .plan-hero{min-height:330px}
  .h1{font-size:30px}
}


/* =========================================================================
   Catalogue depth, added when Browse grew past a hundred places.
   The strip is the first thing on Browse, and the count is the message:
   the number is set as heavy as the label so breadth reads at a glance.
   ========================================================================= */
.catstrip{display:flex;gap:10px;margin:22px 0 4px;overflow-x:auto;padding-bottom:4px;
  scrollbar-width:none;-ms-overflow-style:none}
.catstrip::-webkit-scrollbar{display:none}
.catt{flex:1 1 0;min-width:132px;display:flex;align-items:baseline;gap:8px;
  padding:13px 16px;border-radius:var(--r-card);background:var(--surface);
  box-shadow:var(--lift-1);color:var(--ink-3);transition:box-shadow .16s, color .16s;
  text-align:left;white-space:nowrap}
.catt b{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.catt em{margin-left:auto;font-style:normal;font-size:20px;font-weight:800;
  letter-spacing:-.02em;color:var(--ink);line-height:1}
.catt:hover{box-shadow:var(--lift-2)}
.catt.on{color:var(--ink);box-shadow:var(--lift-2)}
.catt.rose.on{background:var(--t-rose);color:var(--i-rose)}
.catt.rose.on em{color:var(--i-rose)}
.catt.sand.on{background:var(--t-sand);color:var(--i-sand)}
.catt.sand.on em{color:var(--i-sand)}
.catt.sage.on{background:var(--t-sage);color:var(--i-sage)}
.catt.sage.on em{color:var(--i-sage)}
.catt.sky.on{background:var(--t-sky);color:var(--i-sky)}
.catt.sky.on em{color:var(--i-sky)}
.catt.amber.on{background:var(--t-amber);color:var(--i-amber)}
.catt.amber.on em{color:var(--i-amber)}
.catt:not(.rose):not(.sand):not(.sage):not(.sky):not(.amber).on{background:var(--ink);color:#fff}
.catt:not(.rose):not(.sand):not(.sage):not(.sky):not(.amber).on em{color:#fff}

/* a count beside a filter option, so a long cuisine list stays scannable */
.opt .fn{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:600;
  color:var(--ink-3);letter-spacing:.01em}
.opt.on .fn{color:inherit;opacity:.72}

/* the filter rail grew; give the long lists their own scroll instead of a long page */
.fbody{max-height:288px;overflow-y:auto}

/* compact segment, used inside the Today builder panel */
.seg-sm{display:flex;width:100%}
.seg-sm button{flex:1;padding:7px 10px;font-size:12.5px}

@media (max-width:820px){
  .catstrip{margin:18px -18px 2px;padding:0 18px 4px}
  .catt{flex:0 0 auto;min-width:0;padding:11px 14px;gap:10px}
  .catt em{font-size:17px;margin-left:0}
  .fbody{max-height:none}
}

/* the tier control does nothing while a search is running */
.seg.off{opacity:.42}
.seg.off button{cursor:default}

/* ---------- QA fixes after the catalogue expansion ---------- */

/* Filter rows and the tier segment came out at 34 to 35px on desktop. The project's own
   bar is 40px everywhere, not only on the phone, so raise them at every width. */
.opt{min-height:40px}
.seg button{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.seg-sm button{min-height:40px}
.catt{min-height:44px}

/* The map popup now opens downward when the pin sits near the top of the canvas.
   The pointer has to move with it. */
.mappop.below{box-shadow:var(--lift-3)}

/* the sheet supplies its own title, so the panel header collapses to one control */
.sheet-frow{justify-content:flex-end;padding-bottom:6px;border-bottom:0}

/* The type eyebrow on a card. Small and letterspaced so it reads as a label rather than
   competing with the name, and tinted by category so a grid of 51 restaurants can be
   scanned for "Thai" without reading a single why line. */
.card-ty{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;margin:0 0 3px;color:var(--ink-3)}
.card-ty.rose{color:var(--i-rose)} .card-ty.sand{color:var(--i-sand)}
.card-ty.sage{color:var(--i-sage)} .card-ty.sky{color:var(--i-sky)}
.card-ty.amber{color:var(--i-amber)}

/* =========================================================================
   Seoul Side B, v3. Activity detail page only.
   Loaded after styles.css and styles-v2.css. Everything here is scoped to
   .detail-do so restaurants, shops and views keep the v2 layout untouched.

   The problem this fixes: an activity was rendering as one lonely photo plus a
   grid of equal keyword boxes that mixed "wine cave and tasting" with
   "09:00-18:00, closed Monday". Experience and admin now live apart, and the
   gallery carries real weight.
   ========================================================================= */

/* ---------- top: gallery left, summary right ---------- */
.detail-do .dcols{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:38px}

.galx{display:flex;flex-direction:column;gap:10px}
.galx-main{position:relative;border-radius:16px;overflow:hidden;background:var(--t-chip);
  aspect-ratio:3/2;box-shadow:var(--lift-1)}
.galx-main img{width:100%;height:100%;object-fit:cover;display:block}
.galx-thumbs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.galx-thumbs button{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;
  background:var(--t-chip);display:block;box-shadow:var(--lift-1);
  transition:box-shadow .16s,transform .16s}
.galx-thumbs button img{width:100%;height:100%;object-fit:cover;display:block;
  transition:opacity .16s}
.galx-thumbs button:hover img{opacity:.86}
.galx-thumbs button.on{box-shadow:0 0 0 2.5px var(--ink)}
.galx-thumbs button.on img{opacity:1}
.galx-one .galx-main{aspect-ratio:16/10}

/* ---------- right column ---------- */
.detail-do .d-h1{font-size:44px;letter-spacing:-.03em;line-height:1.02}
.detail-do .d-lead{font-size:19.5px;line-height:1.46;color:var(--ink-2);margin-top:16px}

.statx{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:26px 0 0;
  border-radius:14px;overflow:hidden;box-shadow:var(--lift-1);background:var(--surface)}
.statx > div{padding:15px 17px;display:flex;gap:12px;align-items:flex-start;
  border-top:1px solid var(--line-soft);border-left:1px solid var(--line-soft)}
.statx > div:nth-child(-n+2){border-top:0}
.statx > div:nth-child(odd){border-left:0}
.statx .ic{color:var(--ink-3);margin-top:2px;flex:none}
.statx b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.015em;line-height:1.22}
.statx span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.3}

/* ---------- bottom: editorial left, practical right ---------- */
.detail-do .dbot{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
  gap:44px;margin-top:52px;align-items:start}

.artsec{margin:0 0 40px}
.artsec:last-child{margin-bottom:0}
.artsec > h2{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 16px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.artsec p{font-size:16px;line-height:1.62;color:var(--ink-2);margin:0 0 13px;max-width:68ch}
.artsec p:last-child{margin-bottom:0}
.artsec p strong{color:var(--ink);font-weight:700}

/* experience highlights: a list, not a chip grid */
.hilist{list-style:none;margin:0;padding:0}
.hilist li{display:flex;gap:15px;padding:15px 0;border-top:1px solid var(--line-soft);
  align-items:flex-start}
.hilist li:first-child{border-top:0;padding-top:2px}
.hilist .hi-ic{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--t-sage);color:var(--i-sage)}
.hilist .hi-ic .ic{width:19px;height:19px}
.hilist .hi-t{min-width:0;padding-top:7px}
.hilist b{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.012em;color:var(--ink);
  line-height:1.32}
.hilist span{display:block;font-size:14px;color:var(--ink-3);margin-top:3px;line-height:1.5}

/* good to know: plain prose rows, no boxes */
.knowlist{list-style:none;margin:0;padding:0}
.knowlist li{display:flex;gap:13px;padding:13px 0;border-top:1px solid var(--line-soft);
  font-size:15px;line-height:1.55;color:var(--ink-2)}
.knowlist li:first-child{border-top:0;padding-top:0}
.knowlist .ic{color:var(--ink-3);flex:none;margin-top:3px}
.knowlist b{color:var(--ink);font-weight:700}
.knowlist .warn-t{color:var(--i-amber)}

/* best time: a quiet row of facts */
.whenrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:22px}
.whenrow > div b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.whenrow > div span{font-size:14px;color:var(--ink-2);line-height:1.5}

/* ---------- right rail ---------- */
.rail-v3{position:sticky;top:calc(var(--nav-h) + var(--sat) + 22px);display:flex;
  flex-direction:column;gap:30px}
.railsec > h3{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 13px}
.railrow{display:flex;gap:13px;padding:13px 0;border-top:1px solid var(--line-soft);align-items:flex-start}
.railrow:first-of-type{border-top:0;padding-top:0}
.railrow .ph{width:74px;height:58px;border-radius:9px;overflow:hidden;background:var(--t-chip);flex:none}
.railrow .ph img{width:100%;height:100%;object-fit:cover}
.railrow .tx{min-width:0;flex:1}
.railrow b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.012em;line-height:1.28}
.railrow p{margin:4px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.42;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.railrow .mt{margin-top:5px;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.linklist{display:flex;flex-direction:column;gap:9px}
.linklist a{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 15px;
  border-radius:11px;background:var(--surface);box-shadow:var(--lift-1);font-size:14px;font-weight:600}
.linklist a:hover{box-shadow:var(--lift-2)}
.linklist a .ic{color:var(--ink-3)}
.linklist a .go{margin-left:auto;color:var(--ink-3)}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .detail-do .dcols{grid-template-columns:1fr;gap:26px}
  .detail-do .dbot{grid-template-columns:1fr;gap:34px}
  .rail-v3{position:static}
  .detail-do .d-h1{font-size:36px}
}
@media (max-width:820px){
  .detail-do .d-h1{font-size:29px}
  .detail-do .d-lead{font-size:16.5px;margin-top:12px}
  .galx-main{aspect-ratio:4/3;border-radius:13px}
  .galx-thumbs{gap:7px}
  .galx-thumbs button{border-radius:8px}
  .statx{grid-template-columns:1fr 1fr;margin-top:20px}
  .statx > div{padding:13px 13px}
  .statx b{font-size:15px}
  .artsec{margin-bottom:30px}
  .artsec > h2{font-size:13.5px;margin-bottom:13px}
  .artsec p{font-size:15.5px;line-height:1.6}
  .hilist li{padding:13px 0;gap:13px}
  .hilist .hi-ic{width:34px;height:34px;border-radius:10px}
  .hilist b{font-size:15.5px}
  .detail-do .dbot{margin-top:36px}
  .whenrow{gap:16px}
}
@media (max-width:420px){
  /* keep all five thumbs on one row so every photo stays reachable,
     rather than orphaning the fifth onto a half-width line of its own */
  .galx-thumbs{gap:6px}
  .galx-thumbs button{aspect-ratio:1/1;border-radius:7px}
}

/* =========================================================================
   Seoul Side B, v4. Additive only, loaded last.

   Three things needed CSS in this pass:
     1. a real Leaflet map, skinned to match the rest of the guide rather than
        left in Leaflet's default blue-and-grey
     2. a price that is a number rather than a symbol, in the card meta row
     3. two small additions to the activity page, a note above the "eat on the
        way back" rail and one large supporting image mid-article

   Nothing here restyles an existing component. The visual language, the
   palette, the radii and the shadows are all v2/v3 tokens.
   ========================================================================= */

/* ---------- price in the card meta row ---------- */
/* The verified figure is the thing you read; the ₩₩ symbol stays as a quiet
   second mark so the at-a-glance comparison across cards still works. */
.meta i.pricey{gap:5px}
.meta i.pricey b{font-weight:700;color:var(--ink);letter-spacing:-.01em}
.meta i.pricey em{font-style:normal;color:var(--ink-3);opacity:.72;font-size:.92em}

/* ---------- activity page additions ---------- */
.railnote{margin:0 0 12px;font-size:12.5px;line-height:1.5;color:var(--ink-3)}

/* One large image between sections, for the places whose whole appeal is what
   they look like. Deliberately not offered to a restaurant or a shop. */
.bigshot{margin:0 0 40px;border-radius:16px;overflow:hidden;background:var(--t-chip);
  box-shadow:var(--lift-1)}
.bigshot img{display:block;width:100%;height:100%;object-fit:cover;aspect-ratio:21/9}
@media (max-width:820px){
  .bigshot{margin-bottom:30px;border-radius:13px}
  .bigshot img{aspect-ratio:16/9}
}

/* =========================================================================
   THE MAP
   v3 positioned lat/lng as percentages on a blank canvas: no streets, no
   river, no way to tell a walk from an hour. Leaflet now owns positioning and
   the tiles are real. Everything below is skin.
   ========================================================================= */

/* No background here: at phone width the legend drops into normal flow inside this box,
   and a tinted wrap would put a grey slab under it. The map element carries its own. */
.leafwrap{position:relative;border-radius:16px;box-shadow:var(--lift-1);background:transparent}
.leaf{border-radius:16px;overflow:hidden}
.leaf{height:clamp(430px,64vh,660px);width:100%;background:#EDE7DF}
.leaf.dead{display:none}

/* Leaflet's own chrome, restyled to the guide's surfaces */
.leaf .leaflet-control-zoom{border:0;box-shadow:var(--lift-1);border-radius:11px;overflow:hidden}
.leaf .leaflet-control-zoom a{width:34px;height:34px;line-height:33px;background:var(--surface);
  color:var(--ink);border:0;border-bottom:1px solid var(--line-soft);font-size:19px;font-weight:600}
.leaf .leaflet-control-zoom a:last-child{border-bottom:0}
.leaf .leaflet-control-zoom a:hover{background:var(--paper)}
.leaf .leaflet-bar{border:0}
.leaf .leaflet-control-attribution{background:rgba(255,255,255,.88);color:var(--ink-3);
  font-family:var(--f-ui);font-size:10.5px;padding:2px 7px;border-radius:7px 0 0 0}
.leaf .leaflet-control-attribution a{color:var(--ink-2);text-decoration:underline}

/* ---------- pins ---------- */
.lpin-wrap{background:none;border:0}
.lpin{display:block;width:18px;height:18px;border-radius:50%;background:var(--pc,#6B6259);
  box-shadow:0 0 0 2.5px #fff, 0 1px 4px rgba(22,19,15,.34);
  transition:transform .14s ease, box-shadow .14s ease}
.lpin-wrap:hover .lpin{transform:scale(1.22)}
.lpin.sel{transform:scale(1.32);box-shadow:0 0 0 3px #fff, 0 0 0 5.5px var(--pc), 0 2px 8px rgba(22,19,15,.3)}
.lpin.home{width:26px;height:26px;background:var(--ink);
  box-shadow:0 0 0 3px #fff, 0 2px 9px rgba(22,19,15,.4);position:relative}
.lpin.home::after{content:"";position:absolute;inset:0;margin:auto;width:9px;height:9px;
  border-radius:2px;background:#fff}

/* ---------- clusters ---------- */
/* 130 pins on one citywide view is a smear. They group until the zoom at which
   the street names start doing useful work. */
.lclu-wrap{background:none;border:0}
.lclu{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;
  background:var(--surface);color:var(--ink);font-family:var(--f-ui);font-size:13px;
  font-weight:700;letter-spacing:-.02em;
  box-shadow:0 0 0 2px #fff, 0 0 0 3.5px rgba(22,19,15,.16), 0 2px 8px rgba(22,19,15,.2);
  transition:transform .14s ease}
.lclu.mid{width:40px;height:40px;font-size:14px}
.lclu.big{width:48px;height:48px;font-size:15px;background:var(--ink);color:var(--paper);
  box-shadow:0 0 0 2px #fff, 0 0 0 3.5px rgba(22,19,15,.2), 0 3px 12px rgba(22,19,15,.28)}
.lclu-wrap:hover .lclu{transform:scale(1.08)}

/* ---------- popup ---------- */
.lpop-w .leaflet-popup-content-wrapper{border-radius:14px;padding:0;overflow:hidden;
  box-shadow:var(--lift-2);background:var(--surface)}
.lpop-w .leaflet-popup-content{margin:0;width:auto !important;font-family:var(--f-ui);
  line-height:1.4}
.lpop-w .leaflet-popup-tip{background:var(--surface);box-shadow:none}
.lpop-w .leaflet-popup-close-button{width:26px;height:26px;top:7px;right:7px;color:#fff;
  font-size:19px;line-height:24px;border-radius:50%;background:rgba(22,19,15,.42);
  text-shadow:none;font-weight:500}
.lpop-w .leaflet-popup-close-button:hover{background:rgba(22,19,15,.66);color:#fff}
.lpop img{display:block;width:100%;height:112px;object-fit:cover;background:var(--t-chip)}
.lpop-b{padding:11px 13px 13px}
.lpop-cat{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--pc,#6B6259);margin-bottom:5px}
.lpop b{display:block;font-size:15px;letter-spacing:-.018em;line-height:1.22;color:var(--ink)}
.lpop p{margin:5px 0 8px;font-size:12.5px;color:var(--ink-2);line-height:1.42;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lpop-m{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3);
  margin-bottom:10px}
.lpop-m i{font-style:normal;opacity:.55}
.lpop-m .ic{flex:none}
.lpop-a{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.lpop-a .btn{height:34px;font-size:12.5px;padding:0 10px;min-width:0;white-space:nowrap}

/* ---------- legend ---------- */
.leafwrap .maplg{position:absolute;left:12px;bottom:12px;z-index:401;display:flex;
  flex-wrap:wrap;gap:4px 12px;padding:8px 12px;border-radius:11px;
  background:rgba(255,255,255,.93);box-shadow:var(--lift-1);
  font-size:11.5px;color:var(--ink-2);max-width:calc(100% - 92px);pointer-events:none}
.leafwrap .maplg i{display:flex;align-items:center;gap:6px;font-style:normal}
.leafwrap .maplg .d{width:9px;height:9px;border-radius:50%;flex:none}
.leafwrap .maplg .d.hm{background:var(--ink)}

/* ---------- tile failure ---------- */
/* Never an empty beige rectangle with nothing in it. If the tiles do not come,
   the map says so and hands over to Naver. */
.mapfail{position:absolute;inset:0;z-index:700;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9px;text-align:center;padding:26px;
  background:var(--paper)}
.mapfail[hidden]{display:none}
.mapfail .ic{color:var(--i-amber)}
.mapfail b{font-size:17px;letter-spacing:-.02em;color:var(--ink)}
.mapfail span{font-size:14px;color:var(--ink-2);max-width:34ch;line-height:1.5}
.mapfail .btn{margin-top:6px;height:42px;padding:0 20px}

@media (max-width:820px){
  .leafwrap,.leaf{border-radius:13px}
  .leaf{height:clamp(420px,64vh,560px)}
  /* On a phone the map is barely taller than an open popup, so a floating legend lands on
     top of the popup's buttons. Drop it out of the overlay and into normal flow below. */
  .leafwrap .maplg{position:static;max-width:none;margin-top:9px;padding:0 2px;
    background:transparent;box-shadow:none;gap:4px 14px;font-size:11.5px}
  .lpop img{height:92px}
  .lpop p{-webkit-line-clamp:2}
  .lpop-b{padding:10px 12px 12px}
}

/* Standard OSM raster is a busy basemap: bright red motorways, saturated greens.
   A light desaturation settles it behind the pins without altering what it shows.
   Applied to the tile pane only, so pins, popups and controls keep full colour. */
.leaf .leaflet-tile-pane{filter:saturate(.62) contrast(.94) brightness(1.045)}

/* ---------- real menu prices on a restaurant page ---------- */
/* Pulled from the venue's own Naver menu, so these are the actual dish names and the
   actual prices. They sit above the hand-written "what to order" tiles. */
.menurow{display:flex;flex-direction:column;gap:0;margin:0 0 14px}
.menurow i{display:flex;align-items:baseline;gap:10px;font-style:normal;
  padding:8px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.menurow i:first-child{border-top:0;padding-top:0}
.menurow i span{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.menurow i b{margin-left:auto;font-weight:700;color:var(--ink);white-space:nowrap}

   on purpose: no redesign, only what the new content and the map fix need. */

function km(a, b){
  if (!a || !b || a.lat == null || b.lat == null || a.lng == null || b.lng == null) return null;

function foodNearHome(p, n){

      return o.cat === "EAT" && o.id !== p.id && !has("no", o.id) && o.lat != null &&
             km(o, HOMEC) <= 1.3; })
    .map(function(o){ return {p:o, d:km(o, HOMEC)}; })
    .sort(function(a,b){
      var ba = Math.floor(a.d / 0.4), bb = Math.floor(b.d / 0.4);
      return ba !== bb ? ba - bb : (b.p.rating||0) - (a.p.rating||0); })
    .slice(0, n || 2);
}

// A pairing has to survive the question "would we actually go from here to there".
// Distance first, then route logic, and anything that fails both is not offered.
function pairReason(p, o){
  var d = km(p, o);
  if (d == null) return null;
  var w = walkMin(d);
  if (w <= 18) return {t: w + " min walk", i: "walk", d: d, rank: d};
  // A shared subway line is only a pairing if the second place is also out this way. Without
  // that test, everything within 12km of a Line 7 stop qualified, and Gwangmyeong Cave was
  // pairing with a riverside park two minutes from the flat on the grounds that both touch
  // Line 7. A pairing is a second stop on the same outing, not a list of things near home.
  var outP = km(p, HOMEC), outO = km(o, HOMEC);
  var sameWayOut = outP == null || outO == null || outO >= outP * 0.55;
  var shared = (p.lines || []).filter(function(l){ return (o.lines || []).indexOf(l) > -1; });
  var home = shared.filter(function(l){ return HOME_LINES.indexOf(l) > -1; })[0];
  if (d <= 4.5) return {t: rideMin(d) + " min taxi", i: "bus", d: d, rank: d};
  if (home && d <= 12 && sameWayOut)
    return {t: "on the " + home + " run home", i: "train", d: d, rank: d * 0.45};
  if (shared.length && d <= 12 && sameWayOut)
    return {t: "same " + shared[0] + ", no change", i: "train", d: d, rank: d * 0.6};
  if (d <= 6.5) return {t: rideMin(d) + " min taxi", i: "bus", d: d, rank: d * 1.1};
  return null;
}
function pairsFor(p, n){
  return P.filter(function(o){
      return o.id !== p.id && o.cat !== "EAT" && o.cat !== "EVENT" &&
             !has("no", o.id) && o.lat != null; })
    .map(function(o){ var r = pairReason(p, o); return r ? {p:o, r:r} : null; })
    .filter(Boolean)
    .sort(function(a,b){ return a.r.rank - b.r.rank; })
    .slice(0, n || 3);
}

// ── price ───────────────────────────────────────────────────────────────────
// ₩₩ answers "is this expensive". It does not answer "what will this cost", which is the
// question you actually have standing outside. priceText carries the verified figure and the
// symbol drops to a secondary mark beside it.
function priceShort(p){
  if (p.priceText) return p.priceText;
  if (p.cost === "Free") return "Free";
  return null;
}
function priceLong(p){
  return p.priceText || p.costNote || p.cost;
}
// Sorting by price only means anything where a real number exists. Everything without one
// sorts to the end rather than pretending ₩₩ is a quantity.
function priceValue(p){
  var s = p.priceText || "";
  var m = s.replace(/,/g, "").match(/\u20a9\s*(\d+)/);
  if (/^\s*free\b/i.test(s) || p.cost === "Free") return 0;
  if (m) return parseInt(m[1], 10);
  return null;
}

// ── recommendation ──────────────────────────────────────────────────────────
// Browse opens on the whole catalogue now, so the first screen has to be the right first
// screen. Tier dominates, exactly as asked: core, then alternative, then niche. Inside a
// tier the tie-breaks are quality, distinctiveness, usefulness and travel burden, and travel
// is a small term rather than the sort key, or this collapses back into "closest to home".
// Proportional round-robin across the five categories. Order inside a category is never
// changed, so the best shopping entry still comes before the second-best shopping entry.
function interleaveByCat(list){
  var order = ["SHOP","EAT","DO","VIEW","EVENT"], buckets = {}, n = 0;
  order.forEach(function(k){ buckets[k] = []; });
  list.forEach(function(p){ if (buckets[p.cat]) { buckets[p.cat].push(p); n++; } });
  var idx = {}, out = [];
  order.forEach(function(k){ idx[k] = 0; });
  while (out.length < n){
    var pick = null, best = 2;
    order.forEach(function(k){
      var b = buckets[k];
      if (idx[k] >= b.length) return;
      // how far through this category we are, as a fraction; the least-advanced goes next
      var progress = idx[k] / b.length;
      if (progress < best){ best = progress; pick = k; }
    });
    if (!pick) break;
    out.push(buckets[pick][idx[pick]++]);
  }
  return out;
}

function recScore(p){
  var s = 0;
  s += p.tier === "core" ? 1000 : p.tier === "alt" ? 500 : 120;
  if (p.rec) s += p.rec * 10;                       // hand-set nudge, -5 to +5, usually absent
  if (p.rating) s += Math.max(0, (p.rating - 3.8)) * 90;      // 4.8 is worth ~90, 3.9 nothing
  if (p.reviews) s += Math.min(40, Math.log(p.reviews + 1) * 6);
  if ((p.images || []).length >= 4) s += 14;        // a page that can carry itself visually
  if (p.highlights && p.highlights.length >= 3) s += 22;
  var t = p.travel && p.travel.min;
  s -= t == null ? 12 : t <= 20 ? 0 : t <= 35 ? 8 : t <= 50 ? 20 : 34;
  if (has("been", p.id)) s -= 260;                  // still listed, no longer led with
  if (p.cat === "EVENT") s += 40;                   // time-limited, so it deserves the top
  return s;
}

// The catalogue size is quoted in five places. Compute it once so it can never drift
// from the data again.
var WORDNUM = {100:"A hundred",110:"A hundred and ten",120:"A hundred and twenty",
               130:"A hundred and thirty",140:"A hundred and forty",150:"A hundred and fifty",
               160:"A hundred and sixty",170:"A hundred and seventy",
               180:"A hundred and eighty",190:"A hundred and ninety",200:"Two hundred"};
function nPlaces(words){
  var n = P.filter(function(p){ return p.cat !== "EVENT"; }).length;
  if (!words) return n;
  var r = Math.floor(n/10)*10;
  return (WORDNUM[r] ? (n === r ? WORDNUM[r] : "More than " + WORDNUM[r].toLowerCase()) : n) + " places";
}
function nEvents(){ return P.filter(function(p){ return p.cat === "EVENT"; }).length; }

// How long a visit takes, in hours, read off the human string rather than matched against
// it. The old version tested for literal ranges like "2–4", so the ten places written
// "2–3 hr" fell through every time bucket and vanished whenever one was ticked.
// Takes the upper end of the range, because that is what you have to budget.
function hoursOf(p){
  var t = (p.time || "").toLowerCase();
  if (/full day/.test(t)) return 6;
  if (/half day/.test(t)) return 4.5;
  if (/film length/.test(t)) return 2.5;
  var nums = [], m, re = /(\d+(?:\.\d+)?)\s*(min|hr|hour)?/g;
  while ((m = re.exec(t))) nums.push([parseFloat(m[1]), m[2] || null]);
  if (!nums.length) return /day/.test(t) ? 6 : 2;
  var last = nums[nums.length - 1];
  var unit = last[1];
  if (!unit) unit = /hr|hour/.test(t) ? "hr" : "min";   // "45–90 min" leaves the first number bare
  return unit === "min" ? last[0] / 60 : last[0];
}
function closedOn(p, day){
  if (!p.chuseokLabel) return false;
  var m = p.chuseokLabel.match(/Closed (\d+)(?:–(\d+))?/);
  if (!m) return false;
  var a = +m[1], b = m[2] ? +m[2] : a;
  return day >= a && day <= b;
}
function toast(msg){
  var t = el("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2000);
}

// visible = not marked "not interested"; recommendations also hide "already went"
function pool(opts){
  opts = opts || {};
  return P.filter(function(p){
    if (has("no", p.id)) return false;
    if (opts.hideBeen && has("been", p.id)) return false;
    return true;
  });
}

  var parts = h.split("/");
  var prev = route.view, prevArg = route.arg;
  route.view = parts[0] || "home";
  route.arg = parts[1] ? decodeURIComponent(parts[1]) : null;

  // pressed Browse, and Browse means the whole catalogue. A mood left over from an earlier

  if (route.view === "browse" && !route.arg && prev !== "browse" && prev !== "place"){
    if (F && (F.mood || F.cat)){
      F.mood = null; F.cat = null; F.types = []; F.tier = "all"; F.sort = "rec";

}

// The home row is the product's shop window. Sorting purely by distance fills it with
// six restaurants near the flat, which reads as one repeated card. Take the closest
// core pick from each category in turn, one per cluster, so the row shows the range.
function curatedSix(){
  var avail = pool({hideBeen:true}).filter(function(p){
    return p.tier === "core" && p.cat !== "EVENT" && p.images && p.images.length;
  }).sort(function(a,b){ return (a.travel.min||99) - (b.travel.min||99); });
  var order = ["SHOP","DO","SHOP","VIEW","SHOP","EAT"];
  var out = [], usedCluster = {}, usedId = {};
  order.forEach(function(cat){
    for (var i = 0; i < avail.length; i++){
      var p = avail[i];
      if (usedId[p.id] || p.cat !== cat || usedCluster[p.cluster]) continue;
      out.push(p); usedId[p.id] = 1; usedCluster[p.cluster] = 1; return;
    }
  });
  for (var i = 0; i < avail.length && out.length < 6; i++){
    if (!usedId[avail[i].id]) { out.push(avail[i]); usedId[avail[i].id] = 1; }
  }
  return out.slice(0,6);
}

// ── browse ────────────────────────────────────────────────────────
// Browse used to open on core picks sorted by distance, which made a 133-entry catalogue
// look like a short list of things near the flat. It opens on everything now, ordered by
// what we would actually recommend. Distance is still one click away as its own sort.
var F = {mood:null, cat:null, areas:[], types:[], times:[], prices:[], travel:null,
         tier:"all", sort:"rec", q:"", lowWalk:false, rain:false, openDay:null};

function clearFilters(){
  F.areas=[]; F.types=[]; F.times=[]; F.prices=[]; F.travel=null;
  F.lowWalk=false; F.rain=false; F.openDay=null;
}

// Everything the filter rail offers is derived from the catalogue, never hardcoded,
// so a category with no bakeries simply does not offer "Bakery".
function areasList(){
  var s = {};
  P.forEach(function(p){ if (p.cluster && (!F.cat || p.cat === F.cat)) s[p.cluster] = 1; });
  var out = Object.keys(s).sort();
  // a cluster the current category cannot reach would strand the user on an empty list
  F.areas = F.areas.filter(function(a){ return out.indexOf(a) > -1; });
  return out;
}
// The type facet is what makes 51 restaurants navigable. It is scoped to the selected
// category, because "Bowling" and "Italian" in one list is chip soup.
function typesList(){
  var s = {};
  P.forEach(function(p){ if (p.type && (!F.cat || p.cat === F.cat)) s[p.type] = (s[p.type]||0)+1; });
  var out = Object.keys(s).sort();
  F.types = F.types.filter(function(a){ return out.indexOf(a) > -1; });
  return out.map(function(k){ return [k, s[k]]; });
}
function catCounts(){
  var c = {SHOP:0, EAT:0, DO:0, VIEW:0, EVENT:0};
  P.forEach(function(p){ if (!has("no", p.id) && c[p.cat] !== undefined) c[p.cat]++; });
  return c;
}
function matches(p){
  if (has("no", p.id)) return false;
  if (F.mood && (p.moods||[]).indexOf(F.mood) < 0) return false;
  if (F.cat && p.cat !== F.cat) return false;
  if (F.areas.length && F.areas.indexOf(p.cluster) < 0) return false;
  if (F.types.length && F.types.indexOf(p.type) < 0) return false;
  if (F.prices.length && F.prices.indexOf(p.cost) < 0) return false;
  // "More options" deliberately shows alt and niche together. Niche is routing logic,
  // not a lower grade, and the interface never names it.
  // A typed search ignores the tier control entirely. Someone searching "uniqlo" wants every
  // Uniqlo in the guide, not the ones that happen to sit in the first list.
  if (!F.q){
    if (F.tier === "core" && p.tier !== "core") return false;
    if (F.tier === "alt" && p.tier === "core") return false;
  }
  if (F.lowWalk && (p.bestFor||[]).join(" ").toLowerCase().indexOf("low walking") < 0
      && (p.time||"").indexOf("hr") > -1 && !/30|45|60|90/.test(p.time)) return false;
  if (F.travel && (p.travel.min == null || p.travel.min > F.travel)) return false;
  if (F.rain && (p.moods||[]).indexOf("rain") < 0) return false;
  if (F.openDay && closedOn(p, F.openDay)) return false;
  if (F.times.length){
    var h = hoursOf(p), ok = false;
    F.times.forEach(function(k){
      if (k === "u2"   && h <= 2) ok = true;
      if (k === "24"   && h > 1.5 && h <= 4.5) ok = true;
      if (k === "half" && h >= 3 && h <= 6) ok = true;
      if (k === "full" && h >= 5) ok = true;
    });
    if (!ok) return false;
  }
  if (F.q){
    var hay = [p.name, p.nameKr, p.type, p.cluster, p.station, p.area, p.why,
               (p.whats||[]).join(" "), (p.bestFor||[]).join(" "), CATLABEL[p.cat]].join(" ").toLowerCase();
    if (hay.indexOf(F.q.toLowerCase()) < 0) return false;
  }
  return true;
}
function sorted(list){
  var s = list.slice();
  if (F.sort === "rec"){
    s.sort(function(a,b){
      var d = recScore(b) - recScore(a);
      return d !== 0 ? d : a.name.localeCompare(b.name); });
    // Scoring alone opened Browse on eight restaurants, because a third of the catalogue is
    // restaurants and the best of them are all close to the flat. "Recommended" is supposed
    // to show what the guide has, so the first screens interleave the categories: each one
    // keeps its own quality order, and the next card comes from whichever category is
    // furthest behind its share of the list. Filter to one category and this does nothing.
    if (!F.cat && !F.mood && !F.q) s = interleaveByCat(s);
  }
  if (F.sort === "near") s.sort(function(a,b){ return (a.travel.min||99)-(b.travel.min||99); });
  if (F.sort === "rated") s.sort(function(a,b){ return (b.rating||0)-(a.rating||0); });
  if (F.sort === "az") s.sort(function(a,b){ return a.name.localeCompare(b.name); });
  if (F.sort === "price") s.sort(function(a,b){
    // Only real figures sort. Everything without one goes to the end in recommendation
    // order, because \u20a9\u20a9 is a hint and sorting on it would be a made-up number.
    var va = priceValue(a), vb = priceValue(b);
    if (va == null && vb == null) return recScore(b) - recScore(a);
    if (va == null) return 1;
    if (vb == null) return -1;
    return va - vb; });
  return s;
}

      A.map(function(a){ return '<button class="opt'+(F.areas.indexOf(a)>-1?" on":"")+'" data-area="'+esc(a)+'">'+
        '<span class="box">'+ic("check")+'</span>'+esc(a)+'</button>'; }).join("")+

    '<div class="fgroup"><button data-fold>Travel from '+HOME+ic("chevD","ic-16 ar")+'</button><div class="fbody">'+
      [[0,"Any distance"],[15,"Up to 15 minutes"],[30,"Up to 30 minutes"],[45,"Up to 45 minutes"]].map(function(t){

    '<div class="fgroup"><button data-fold>Time needed'+ic("chevD","ic-16 ar")+'</button><div class="fbody">'+

    '</div></div>'+
    (prices.length > 1 ? '<div class="fgroup"><button data-fold>Price'+ic("chevD","ic-16 ar")+'</button><div class="fbody">'+
      '<button class="opt'+(F.prices.length?"":" on")+'" data-price="*"><span class="box">'+ic("check")+'</span>Any price</button>'+
      prices.map(function(c){ return '<button class="opt'+(F.prices.indexOf(c)>-1?" on":"")+'" data-price="'+c+'">'+
        '<span class="box">'+ic("check")+'</span>'+c+'</button>'; }).join("")+
    '</div></div>' : '')+
    '<div class="fgroup">'+
      [["lowWalk","walk","Low walking",""],
       ["rain","cloud","Rainy day friendly",""]].map(function(t){
        return '<button class="tog'+(F[t[0]]?" on":"")+'" data-tog="'+t[0]+'">'+ic(t[1])+
          '<span class="lab">'+t[2]+(t[3]?'<small>'+t[3]+'</small>':'')+'</span><span class="sw"></span></button>';
      }).join("")+
    '</div>'+
    '<div class="fgroup"><button data-fold>Open on'+ic("chevD","ic-16 ar")+'</button><div class="fbody">'+
      '<button class="opt'+(F.openDay?"":" on")+'" data-day="0"><span class="box">'+ic("check")+'</span>Any day</button>'+
      TRIP.map(function(t){ return '<button class="opt'+(F.openDay===t.d?" on":"")+'" data-day="'+t.d+'">'+
        '<span class="box">'+ic("check")+'</span>'+t.dow+' '+t.d+' Sep'+
        (HOLIDAY.indexOf(t.d)>-1?' · holiday':'')+'</button>'; }).join("")+
    '</div></div>';
  // The desktop rail used to end in its own "Show results" button, which did nothing there:

  // carried a count. The sheet's own button in the template is the only one now, and it does.
}
